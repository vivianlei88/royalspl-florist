<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>網站編輯器 | RoyalSpl Florist</title>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; overflow: hidden; height: 100vh; }

        /* 顶部工具栏 */
        .editor-toolbar {
            height: 56px;
            background: #fff;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            align-items: center;
            padding: 0 20px;
            gap: 15px;
            position: relative;
            z-index: 100;
        }
        .editor-logo { font-size: 18px; font-weight: 700; color: #1a1a1a; }
        .toolbar-divider { width: 1px; height: 24px; background: #e0e0e0; }
        .page-selector {
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            background: #fff;
            cursor: pointer;
            min-width: 180px;
        }
        .device-switcher {
            display: flex;
            border: 1px solid #ddd;
            border-radius: 6px;
            overflow: hidden;
        }
        .device-btn {
            padding: 8px 16px;
            border: none;
            background: #fff;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }
        .device-btn.active { background: #1a1a1a; color: #fff; }
        .device-btn:hover:not(.active) { background: #f5f5f5; }
        .lang-switcher {
            display: flex;
            border: 1px solid #ddd;
            border-radius: 6px;
            overflow: hidden;
        }
        .lang-btn {
            padding: 8px 16px;
            border: none;
            background: #fff;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }
        .lang-btn.active { background: #1a1a1a; color: #fff; }
        .lang-btn:hover:not(.active) { background: #f5f5f5; }
        .toolbar-right { margin-left: auto; display: flex; gap: 10px; align-items: center; }
        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-primary { background: #1a1a1a; color: #fff; }
        .btn-primary:hover { background: #333; }
        .btn-secondary { background: #f5f5f5; color: #1a1a1a; border: 1px solid #ddd; }
        .btn-secondary:hover { background: #e8e8e8; }
        .btn-ai { background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; }
        .btn-ai:hover { opacity: 0.9; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        /* 主内容区 */
        .editor-main {
            display: flex;
            height: calc(100vh - 56px);
        }

        /* 左侧编辑面板 */
        .editor-panel {
            width: 360px;
            background: #fff;
            border-right: 1px solid #e0e0e0;
            overflow-y: auto;
            padding: 20px;
        }
        .panel-section { margin-bottom: 25px; }
        .panel-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #1a1a1a;
        }
        .form-group { margin-bottom: 15px; }
        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 6px;
            color: #333;
        }
        .form-input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.2s;
        }
        .form-input:focus { outline: none; border-color: #667eea; }
        .form-textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            min-height: 100px;
            resize: vertical;
            font-family: inherit;
        }
        .form-textarea:focus { outline: none; border-color: #667eea; }

        /* 预览区域 */
        .preview-area {
            flex: 1;
            background: #e8e8e8;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: auto;
        }
        .preview-frame {
            background: #fff;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            border-radius: 8px;
            overflow: hidden;
            transition: all 0.3s;
        }
        .preview-frame.desktop { width: 100%; height: 100%; max-width: 1400px; }
        .preview-frame.mobile { width: 375px; height: 667px; }
        .preview-frame iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* 可编辑元素样式 */
        .editable-text {
            cursor: text;
            transition: outline 0.2s;
            position: relative;
        }
        .editable-text:hover {
            outline: 2px dashed #667eea;
            outline-offset: 2px;
        }
        .editable-text:focus {
            outline: 2px solid #667eea;
            outline-offset: 2px;
            background: rgba(102, 126, 234, 0.05);
        }
        .editable-image {
            cursor: pointer;
            position: relative;
            transition: outline 0.2s;
        }
        .editable-image:hover {
            outline: 2px dashed #667eea;
            outline-offset: 2px;
        }
        .editable-image::after {
            content: '📷 更換圖片';
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.7);
            color: #fff;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 12px;
            opacity: 0;
            transition: opacity 0.2s;
            pointer-events: none;
        }
        .editable-image:hover::after {
            opacity: 1;
        }

        /* AI翻译弹窗 */
        .ai-modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .ai-modal-overlay.active { display: flex; }
        .ai-modal {
            background: #fff;
            border-radius: 12px;
            width: 90%;
            max-width: 600px;
            max-height: 80vh;
            overflow-y: auto;
            padding: 30px;
        }
        .ai-modal-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .ai-translate-item {
            margin-bottom: 15px;
            padding: 15px;
            background: #f9f9f9;
            border-radius: 8px;
        }
        .ai-translate-label {
            font-size: 12px;
            color: #666;
            margin-bottom: 5px;
        }
        .ai-translate-original {
            font-size: 14px;
            color: #333;
            margin-bottom: 8px;
        }
        .ai-translate-result {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            min-height: 40px;
        }
        .ai-modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            justify-content: flex-end;
        }
        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid #f3f3f3;
            border-top: 2px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Toast提示 */
        .toast {
            position: fixed;
            top: 70px;
            right: 20px;
            background: #1a1a1a;
            color: #fff;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 14px;
            z-index: 2000;
            opacity: 0;
            transform: translateY(-20px);
            transition: all 0.3s;
        }
        .toast.show { opacity: 1; transform: translateY(0); }
        .toast.success { background: #43e97b; color: #1a1a1a; }
        .toast.error { background: #f5576c; color: #fff; }
    </style>
</head>
<body>
    <!-- 顶部工具栏 -->
    <div class="editor-toolbar">
        <div class="editor-logo">RoyalSpl Editor</div>
        <div class="toolbar-divider"></div>
        <select class="page-selector" id="pageSelector" onchange="switchPage(this.value)">
            <option value="index">首頁 Home</option>
            <option value="products">商品列表 Products</option>
            <option value="product-detail">商品詳情 Product Detail</option>
            <option value="blog">部落格 Blog</option>
            <option value="faq">常見問題 FAQ</option>
            <option value="contact">聯絡我們 Contact</option>
            <option value="privacy">私隱政策 Privacy</option>
        </select>
        <select class="page-selector" id="productSelector" style="display:none;" onchange="switchProduct(this.value)"></select>
        <div class="device-switcher">
            <button class="device-btn active" onclick="switchDevice('desktop')" title="電腦版">🖥️</button>
            <button class="device-btn" onclick="switchDevice('mobile')" title="手機版">📱</button>
        </div>
        <div class="lang-switcher">
            <button class="lang-btn active" onclick="switchLang('zh')">中文</button>
            <button class="lang-btn" onclick="switchLang('en')">EN</button>
        </div>
        <div class="toolbar-right">
            <button class="btn btn-ai" id="aiTranslateBtn" onclick="openAITranslate()" style="display:none;">✨ AI 翻譯</button>
            <button class="btn btn-secondary" onclick="window.close()">返回後台</button>
            <button class="btn btn-primary" onclick="saveChanges()">💾 保存</button>
        </div>
    </div>

    <!-- 主内容区 -->
    <div class="editor-main" style="padding:20px;">
        <!-- 预览区域（占满宽度） -->
        <div class="preview-area" style="width:100%;">
            <div class="preview-frame desktop" id="previewFrame" style="margin:0 auto;">
                <iframe id="previewIframe" src="/index.html" sandbox="allow-same-origin allow-scripts"></iframe>
            </div>
        </div>
    </div>

    <!-- 浮动编辑提示 -->
    <div id="editHint" style="position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1a1a1a;color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;z-index:1000;opacity:0;transition:opacity 0.3s;pointer-events:none;">
        💡 點擊文字可直接編輯，點擊圖片可上傳更換
    </div>

    <!-- AI翻译弹窗 -->
    <div class="ai-modal-overlay" id="aiModal">
        <div class="ai-modal">
            <div class="ai-modal-title">✨ AI 自動翻譯</div>
            <div id="aiTranslateContent">
                <p style="color:#666;">正在生成翻譯，請稍候...</p>
                <div style="text-align:center;margin-top:20px;"><div class="loading-spinner"></div></div>
            </div>
            <div class="ai-modal-actions">
                <button class="btn btn-secondary" onclick="closeAIModal()">取消</button>
                <button class="btn btn-primary" onclick="applyAITranslation()">應用翻譯</button>
            </div>
        </div>
    </div>

    <!-- 批量翻译弹窗 -->
    <div class="ai-modal-overlay" id="batchTranslateModal" style="display:none;">
        <div class="ai-modal" style="max-width:600px;">
            <div class="ai-modal-title">🔄 批量翻譯全部商品</div>
            <div id="batchTranslateContent">
                <p style="color:#666;margin-bottom:15px;">將自動翻譯所有商品的英文名稱、描述、香調、花材、產地、規格。</p>
                <div style="background:#f9f9f9;padding:15px;border-radius:8px;margin-bottom:15px;">
                    <p style="font-size:14px;margin-bottom:8px;">📊 翻譯進度</p>
                    <div id="batchProgressText" style="font-size:13px;color:#666;margin-bottom:8px;">準備就緒</div>
                    <div style="width:100%;height:8px;background:#e0e0e0;border-radius:4px;overflow:hidden;">
                        <div id="batchProgressBar" style="width:0%;height:100%;background:linear-gradient(135deg,#667eea,#764ba2);transition:width 0.3s;"></div>
                    </div>
                </div>
                <div id="batchResult" style="max-height:200px;overflow-y:auto;font-size:13px;"></div>
            </div>
            <div class="ai-modal-actions">
                <button class="btn btn-secondary" onclick="closeBatchTranslateModal()">取消</button>
                <button class="btn btn-primary" id="startBatchBtn" onclick="startBatchTranslate()">開始翻譯</button>
            </div>
        </div>
    </div>

    <!-- 分类选择弹窗 -->
    <div class="ai-modal-overlay" id="categoryModal" style="display:none;">
        <div class="ai-modal" style="max-width:600px;max-height:80vh;overflow-y:auto;">
            <div class="ai-modal-title">選擇分類</div>
            <input type="hidden" id="categoryTargetCard">
            <div id="categoryList" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin:15px 0;"></div>
            <div class="ai-modal-actions">
                <button class="btn btn-secondary" onclick="closeCategoryModal()">取消</button>
            </div>
        </div>
    </div>

    <!-- 商品选择弹窗 -->
    <div class="ai-modal-overlay" id="productModal" style="display:none;">
        <div class="ai-modal" style="max-width:700px;max-height:80vh;overflow-y:auto;">
            <div class="ai-modal-title">選擇商品</div>
            <div style="margin-bottom:15px;"><input type="text" id="productSearchInput" placeholder="搜索商品..." style="width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;font-size:14px;" oninput="filterProducts()"></div>
            <div id="productSelectList" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;max-height:400px;overflow-y:auto;"></div>
            <div class="ai-modal-actions">
                <button class="btn btn-secondary" onclick="closeProductModal()">取消</button>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script>
    var SUPABASE_URL = 'https://gefqlrmozxbgfhxgngtg.supabase.co';
    var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdlZnFscm1venhiZ2ZoeGduZ3RnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYyOTI0MDQsImV4cCI6MjEwMTg2ODQwNH0.oH0fI1xpKn6arQlpvznrXXMMWsD1ZxNazRP4LZeZ68Y';
    var supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    var currentPage = 'index';
    var currentDevice = 'desktop';
    var currentLang = 'zh';
    var currentProductId = null;
    var productsList = [];
    var homepageData = {};
    var aiTranslatedData = {};
    var collectionCards = [];
    var featuredProducts = [];

    // 页面加载时初始化
    document.addEventListener('DOMContentLoaded', function() {
        loadHomepageData();
        loadProductsList();
        loadCollectionCards();
        loadFeaturedProducts();
        updateAITranslateBtn();
    });

    // 加载商品列表
    async function loadProductsList() {
        try {
            var r = await supabaseClient.from('products').select('id, name_zh, name_en').eq('is_active', true).order('created_at', { ascending: false }).limit(50);
            productsList = r.data || [];
            var selector = document.getElementById('productSelector');
            if (selector) {
                selector.innerHTML = '';
                // 添加"所有商品"选项
                var allOpt = document.createElement('option');
                allOpt.value = 'all';
                allOpt.textContent = '📦 所有商品（批量翻譯）';
                selector.appendChild(allOpt);
                productsList.forEach(function(p) {
                    var opt = document.createElement('option');
                    opt.value = p.id;
                    opt.textContent = (p.name_zh || p.name_en || '商品') + ' (#' + p.id + ')';
                    selector.appendChild(opt);
                });
                if (productsList.length > 0) {
                    currentProductId = productsList[0].id;
                }
            }
        } catch (e) {
            console.error('加载商品列表失败:', e);
        }
    }

    // 加载臻选系列卡片
    async function loadCollectionCards() {
        try {
            var r = await supabaseClient.from('collection_cards').select('*').order('sort_order', { ascending: true });
            collectionCards = r.data || [];
        } catch (e) {
            console.error('加载臻选系列失败:', e);
            collectionCards = [];
        }
    }

    // 加载精选花艺
    async function loadFeaturedProducts() {
        try {
            var r = await supabaseClient.from('featured_products').select('*, products(id, name_zh, name_en, price, image_url)').order('sort_order', { ascending: true });
            featuredProducts = r.data || [];
        } catch (e) {
            console.error('加载精选花艺失败:', e);
            featuredProducts = [];
        }
    }

    // 切换商品
    function switchProduct(productId) {
        currentProductId = productId;
        if (productId === 'all') {
            // 选择所有商品时，显示提示
            var frame = document.getElementById('previewFrame');
            if (frame) {
                frame.srcdoc = '<div style="display:flex;align-items:center;justify-content:center;height:100%;font-family:sans-serif;color:#666;font-size:18px;"><div style="text-align:center;"><div style="font-size:48px;margin-bottom:20px;">📦</div><div>已選擇「所有商品」</div><div style="font-size:14px;margin-top:10px;color:#999;">點擊上方「✨ AI 翻譯」按鈕，可批量翻譯全部商品</div></div></div>';
            }
        } else {
            updatePreview();
        }
    }

    // 更新预览
    function updatePreview() {
        var iframe = document.getElementById('previewIframe');
        var prefix = currentLang === 'en' ? '/en/' : '/';
        if (currentPage === 'product-detail' && currentProductId) {
            iframe.src = prefix + 'product-detail.html?id=' + currentProductId;
        } else {
            iframe.src = prefix + currentPage + '.html';
        }
        // iframe加载完成后，启用点击编辑
        iframe.onload = function() {
            setTimeout(function() {
                enableInlineEditing();
                showEditHint();
            }, 500);
        };
    }

    // 显示编辑提示
    function showEditHint() {
        var hint = document.getElementById('editHint');
        if (hint) {
            hint.style.opacity = '1';
            setTimeout(function() {
                hint.style.opacity = '0';
            }, 4000);
        }
    }

    // 启用内联编辑
    function enableInlineEditing() {
        var iframe = document.getElementById('previewIframe');
        var doc = iframe.contentDocument || iframe.contentWindow.document;
        if (!doc) return;

        // 注入可编辑样式
        var style = doc.createElement('style');
        style.textContent = '.editable-text{cursor:text;transition:outline 0.2s;}.editable-text:hover{outline:2px dashed #667eea;outline-offset:2px;}.editable-text:focus{outline:2px solid #667eea;outline-offset:2px;background:rgba(102,126,234,0.05);}.editable-image{cursor:pointer;position:relative;}.editable-image:hover{outline:2px dashed #667eea;outline-offset:2px;}';
        doc.head.appendChild(style);

        if (currentPage === 'index') {
            setupHomepageEditing(doc);
        } else if (currentPage === 'product-detail') {
            setupProductDetailEditing(doc);
        }
    }

    // 设置首页编辑
    function setupHomepageEditing(doc) {
        // Hero Banner标题
        var heroTitle = doc.querySelector('.hero-title, h1');
        if (heroTitle) {
            makeEditable(heroTitle, 'homepage_settings', currentLang === 'en' ? 'hero_title_en' : 'hero_title', homepageData.id || 1);
        }

        // Hero Banner副标题
        var heroSubtitle = doc.querySelector('.hero-subtitle, .hero-sub, .subtitle');
        if (heroSubtitle) {
            makeEditable(heroSubtitle, 'homepage_settings', currentLang === 'en' ? 'hero_subtitle_en' : 'hero_subtitle', homepageData.id || 1);
        }

        // CTA按钮文字
        var ctaBtn = doc.querySelector('.hero-cta, .cta-btn, .btn-primary');
        if (ctaBtn) {
            makeEditable(ctaBtn, 'homepage_settings', currentLang === 'en' ? 'hero_cta_text_en' : 'hero_cta_text', homepageData.id || 1);
        }

        // 臻选系列卡片标题
        var cardTitles = doc.querySelectorAll('.collection-card h3, .collection-card .card-title, .collection-title');
        for (var i = 0; i < cardTitles.length && i < collectionCards.length; i++) {
            makeEditable(cardTitles[i], 'collection_cards', currentLang === 'en' ? 'title_en' : 'title_zh', collectionCards[i].id);
        }

        // 关于我们文字
        var aboutText = doc.querySelector('.about-text, .about-content, #about p');
        if (aboutText) {
            makeEditable(aboutText, 'homepage_settings', currentLang === 'en' ? 'about_text_en' : 'about_text', homepageData.id || 1);
        }
    }

    // 设置商品详情页编辑
    function setupProductDetailEditing(doc) {
        if (!currentProductId) return;

        // 商品名称
        var prodName = doc.querySelector('.product-name, .product-title, h1');
        if (prodName) {
            makeEditable(prodName, 'products', currentLang === 'en' ? 'name_en' : 'name_zh', currentProductId);
        }

        // 商品描述
        var prodDesc = doc.querySelector('.product-description, .description, .product-desc');
        if (prodDesc) {
            makeEditable(prodDesc, 'products', currentLang === 'en' ? 'description_en' : 'description', currentProductId);
        }
    }

    // 使元素可编辑
    function makeEditable(element, table, field, id) {
        element.classList.add('editable-text');
        element.setAttribute('contenteditable', 'true');
        element.setAttribute('data-table', table);
        element.setAttribute('data-field', field);
        element.setAttribute('data-id', id);

        element.addEventListener('blur', function() {
            var newValue = element.innerText.trim();
            saveInlineEdit(table, field, id, newValue);
        });

        // 阻止回车换行（单行文本）
        element.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && element.tagName !== 'TEXTAREA' && element.tagName !== 'P' && element.tagName !== 'DIV') {
                e.preventDefault();
                element.blur();
            }
        });
    }

    // 保存内联编辑
    async function saveInlineEdit(table, field, id, value) {
        try {
            var updateData = {};
            updateData[field] = value;
            await supabaseClient.from(table).update(updateData).eq('id', id);
            showToast('已保存: ' + field);
            // 更新本地数据
            if (table === 'homepage_settings') {
                homepageData[field] = value;

    // 从URL获取分类名称
    function getCategoryNameFromUrl(url) {
        if (!url) return '未選擇';
        var m = url.match(/category=([^&]+)/);
        if (m) {
            try { return decodeURIComponent(m[1]); } catch(e) { return m[1]; }
        }
        return '未選擇';
    }

    // 上传卡片图片
    function uploadCardImage(cardId) {
        document.getElementById('cardFileInput' + cardId).click();
    }

    // 处理卡片图片上传
    async function handleCardImageUpload(cardId, file) {
        if (!file) return;
        var fd = new FormData();
        fd.append('file', file);
        try {
            var res = await fetch('/r2-upload', { method: 'POST', body: fd });
            var data = await res.json();
            if (data.url) {
                await supabaseClient.from('collection_cards').update({ image_url: data.url }).eq('id', cardId);
                // 更新本地数据
                for (var i = 0; i < collectionCards.length; i++) {
                    if (collectionCards[i].id === cardId) {
                        collectionCards[i].image_url = data.url;
                        break;
                    }
                }
                renderEditorPanel();
                showToast('圖片上傳成功');
            } else {
                showToast('上傳失敗', 'error');
            }
        } catch (e) {
            showToast('上傳失敗: ' + e.message, 'error');
        }
    }

                h += (cat.image_url ? '<img src="' + cat.image_url + '" style="width:100%;height:100px;object-fit:cover;">' : '<div style="height:100px;background:#F3EFEA;display:flex;align-items:center;justify-content:center;">無圖</div>');

    // 打开AI翻译
    async function openAITranslate() {
        var modal = document.getElementById('aiModal');
        var content = document.getElementById('aiTranslateContent');
        modal.classList.add('active');
        content.innerHTML = '<p style="color:#666;">正在生成翻譯，請稍候...</p><div style="text-align:center;margin-top:20px;"><div class="loading-spinner"></div></div>';

        try {
            var items = [];
            var translateType = '';

            if (currentPage === 'index') {
                // 首页：翻译所有内容（始终从中文内容翻译）
                translateType = 'homepage';
                items = [
                    { label: '主標題', original: homepageData.hero_title || '', field: 'hero_title_en', table: 'homepage_settings' },
                    { label: '副標題', original: homepageData.hero_subtitle || '', field: 'hero_subtitle_en', table: 'homepage_settings' },
                    { label: 'CTA 按鈕文字', original: homepageData.hero_cta_text || '', field: 'hero_cta_text_en', table: 'homepage_settings' },
                    { label: '關於我們', original: homepageData.about_text || '', field: 'about_text_en', table: 'homepage_settings' }
                ];
                // 臻选系列6个卡片标题
                for (var i = 0; i < collectionCards.length; i++) {
                    var card = collectionCards[i];
                    items.push({
                        label: '臻選系列卡片 ' + (i + 1) + ' 標題',
                        original: card.title_zh || '',
                        field: 'title_en',
                        table: 'collection_cards',
                        id: card.id
                    });
                }
            } else if (currentPage === 'product-detail') {
                // 商品详情页：翻译当前商品的所有文字（始终从中文内容翻译）
                translateType = 'product';

                // 如果选择了"所有商品"，触发批量翻译
                if (currentProductId === 'all') {
                    modal.classList.remove('active');
                    openBatchTranslate();
                    return;
                }

                var product = productsList.find(function(p) { return p.id === currentProductId; });
                if (product) {
                    // 获取商品完整信息
                    var prodRes = await supabaseClient.from('products').select('*').eq('id', currentProductId).limit(1);
                    if (prodRes.data && prodRes.data.length > 0) {
                        var fullProduct = prodRes.data[0];
                        // 香调是数组，需要转为字符串
                        var scentStr = '';
                        if (fullProduct.scent_notes && Array.isArray(fullProduct.scent_notes)) {
                            scentStr = fullProduct.scent_notes.join(', ');
                        } else if (fullProduct.scent) {
                            scentStr = fullProduct.scent;
                        }
                        items = [
                            { label: '商品名稱', original: fullProduct.name_zh || '', field: 'name_en', table: 'products', id: fullProduct.id },
                            { label: '商品描述', original: fullProduct.description || '', field: 'description_en', table: 'products', id: fullProduct.id },
                            { label: '香調', original: scentStr, field: 'scent_notes_en', table: 'products', id: fullProduct.id, isArray: true },
                            { label: '花材', original: fullProduct.specs_flowers || fullProduct.flower_materials || '', field: 'specs_flowers_en', table: 'products', id: fullProduct.id },
                            { label: '產地', original: fullProduct.specs_origin || fullProduct.origin || '', field: 'specs_origin_en', table: 'products', id: fullProduct.id },
                            { label: '規格', original: fullProduct.specs_size || fullProduct.specifications || '', field: 'specs_size_en', table: 'products', id: fullProduct.id }
                        ];
                    }
                }
            } else {
                // 其他页面：提示暂不支持
                content.innerHTML = '<p style="color:#f5576c;">此頁面暫不支持AI翻譯</p>';
                return;
            }

            if (items.length === 0) {
                content.innerHTML = '<p style="color:#f5576c;">沒有可翻譯的內容</p>';
                return;
            }

            // 调用豆包API翻译
            var allText = items.map(function(item) { return item.original; }).join('\n---\n');
            var translated = await callDoubaoTranslate(allText);
            var translatedParts = translated.split('\n---\n');

            aiTranslatedData = { items: items, type: translateType };
            var html = '';
            items.forEach(function(item, i) {
                var result = translatedParts[i] || '';
                item.translated = result;
                html += '<div class="ai-translate-item">' +
                    '<div class="ai-translate-label">' + item.label + '</div>' +
                    '<div class="ai-translate-original">原文: ' + escapeHtml(item.original) + '</div>' +
                    '<textarea class="ai-translate-result" data-index="' + i + '">' + escapeHtml(result) + '</textarea>' +
                    '</div>';
            });

            content.innerHTML = html;
        } catch (e) {
            content.innerHTML = '<p style="color:#f5576c;">翻譯失敗: ' + e.message + '</p>';
        }
    }

    // 调用豆包API翻译
    async function callDoubaoTranslate(text) {
        var response = await fetch('/api/ai-translate', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text: text, target_lang: 'en' })
        });
        if (!response.ok) throw new Error('API調用失敗');
        var data = await response.json();
        return data.translated || data.result || '';
    }

    // 应用AI翻译
    async function applyAITranslation() {
        var textareas = document.querySelectorAll('.ai-translate-result');
        var items = aiTranslatedData.items || [];

        // 更新翻译结果
        textareas.forEach(function(ta) {
            var index = parseInt(ta.getAttribute('data-index'));
            if (items[index]) {
                items[index].translated = ta.value;
            }
        });

        try {
            // 按表分组保存
            var homepageUpdates = {};
            var cardUpdates = {};
            var productUpdates = {};

            for (var i = 0; i < items.length; i++) {
                var item = items[i];
                var value = item.translated;
                // 处理数组类型字段（如香调）
                if (item.isArray && typeof value === 'string') {
                    value = value.split(/[,，、]/).map(function(s) { return s.trim(); }).filter(function(s) { return s; });
                }
                if (item.table === 'homepage_settings') {
                    homepageUpdates[item.field] = value;
                } else if (item.table === 'collection_cards') {
                    if (!cardUpdates[item.id]) cardUpdates[item.id] = {};
                    cardUpdates[item.id][item.field] = value;
                } else if (item.table === 'products') {
                    productUpdates[item.field] = value;
                }
            }

            // 保存首页设置
            if (Object.keys(homepageUpdates).length > 0) {
                await supabaseClient.from('homepage_settings').update(homepageUpdates).eq('id', homepageData.id || 1);
                Object.assign(homepageData, homepageUpdates);
            }

            // 保存臻选系列卡片
            for (var cardId in cardUpdates) {
                await supabaseClient.from('collection_cards').update(cardUpdates[cardId]).eq('id', parseInt(cardId));
                // 更新本地数据
                for (var j = 0; j < collectionCards.length; j++) {
                    if (collectionCards[j].id == cardId) {
                        Object.assign(collectionCards[j], cardUpdates[cardId]);
                        break;
                    }
                }
            }

            // 保存商品
            if (Object.keys(productUpdates).length > 0 && currentProductId) {
                await supabaseClient.from('products').update(productUpdates).eq('id', currentProductId);
                // 更新本地数据
                for (var k = 0; k < productsList.length; k++) {
                    if (productsList[k].id === currentProductId) {
                        Object.assign(productsList[k], productUpdates);
                        break;
                    }
                }
            }

            closeAIModal();
            showToast('翻譯已保存！', 'success');
            // 刷新预览页面以显示翻译后的内容
            updatePreview();
        } catch (e) {
            showToast('保存失敗: ' + e.message, 'error');
        }
    }

    // 关闭AI弹窗
    function closeAIModal() {
        document.getElementById('aiModal').classList.remove('active');
    }

    // 打开批量翻译弹窗
    function openBatchTranslate() {
        document.getElementById('batchTranslateModal').style.display = 'flex';
        document.getElementById('batchProgressText').textContent = '準備就緒，點擊「開始翻譯」開始';
        document.getElementById('batchProgressBar').style.width = '0%';
        document.getElementById('batchResult').innerHTML = '';
        document.getElementById('startBatchBtn').disabled = false;
        document.getElementById('startBatchBtn').textContent = '開始翻譯';
    }

    // 关闭批量翻译弹窗
    function closeBatchTranslateModal() {
        document.getElementById('batchTranslateModal').style.display = 'none';
    }

    // 开始批量翻译
    var batchTranslateRunning = false;
    async function startBatchTranslate() {
        if (batchTranslateRunning) return;
        batchTranslateRunning = true;
        document.getElementById('startBatchBtn').disabled = true;
        document.getElementById('startBatchBtn').textContent = '翻譯中...';

        var resultDiv = document.getElementById('batchResult');
        var progressText = document.getElementById('batchProgressText');
        var progressBar = document.getElementById('batchProgressBar');

        try {
            // 获取所有商品
            var res = await supabaseClient.from('products').select('id, name_zh, description, scent_notes, specs_flowers, specs_origin, specs_size, name_en, description_en, scent_notes_en, specs_flowers_en, specs_origin_en, specs_size_en').eq('is_active', true).order('id', { ascending: true });
            var allProducts = res.data || [];

            // 只翻译没有英文内容的商品
            var productsToTranslate = allProducts.filter(function(p) {
                return !p.name_en || !p.description_en;
            });

            var total = productsToTranslate.length;
            if (total === 0) {
                progressText.textContent = '所有商品都已有英文內容，無需翻譯';
                resultDiv.innerHTML = '<p style="color:#52c41a;">✅ 所有商品都已翻譯完成！</p>';
                batchTranslateRunning = false;
                document.getElementById('startBatchBtn').textContent = '完成';
                return;
            }

            progressText.textContent = '共 ' + total + ' 個商品需要翻譯';
            resultDiv.innerHTML = '';

            var successCount = 0;
            var failCount = 0;

            for (var i = 0; i < total; i++) {
                var product = productsToTranslate[i];
                var progress = Math.round(((i + 1) / total) * 100);
                progressBar.style.width = progress + '%';
                progressText.textContent = '正在翻譯第 ' + (i + 1) + '/' + total + ' 個商品：' + (product.name_zh || '');

                try {
                    // 翻译单个商品
                    var translated = await translateSingleProduct(product);
                    if (translated) {
                        successCount++;
                        resultDiv.innerHTML += '<p style="color:#52c41a;margin:4px 0;">✅ ' + (product.name_zh || '商品#' + product.id) + ' - 翻譯成功</p>';
                    } else {
                        failCount++;
                        resultDiv.innerHTML += '<p style="color:#ff4d4f;margin:4px 0;">❌ ' + (product.name_zh || '商品#' + product.id) + ' - 翻譯失敗</p>';
                    }
                } catch (e) {
                    failCount++;
                    resultDiv.innerHTML += '<p style="color:#ff4d4f;margin:4px 0;">❌ ' + (product.name_zh || '商品#' + product.id) + ' - 錯誤: ' + e.message + '</p>';
                }

                // 滚动到底部
                resultDiv.scrollTop = resultDiv.scrollHeight;

                // 每个商品之间延迟1秒，避免API限流
                if (i < total - 1) {
                    await new Promise(function(resolve) { setTimeout(resolve, 1000); });
                }
            }

            progressText.textContent = '翻譯完成！成功 ' + successCount + ' 個，失敗 ' + failCount + ' 個';
            resultDiv.innerHTML += '<p style="color:#1890ff;margin-top:10px;font-weight:600;">🎉 批量翻譯完成！成功 ' + successCount + ' 個，失敗 ' + failCount + ' 個</p>';
            document.getElementById('startBatchBtn').textContent = '完成';

            // 刷新商品列表和预览
            await loadProductsList();
            updatePreview();

        } catch (e) {
            progressText.textContent = '批量翻譯出錯';
            resultDiv.innerHTML += '<p style="color:#ff4d4f;">❌ 錯誤: ' + e.message + '</p>';
            document.getElementById('startBatchBtn').textContent = '重試';
            document.getElementById('startBatchBtn').disabled = false;
        }

        batchTranslateRunning = false;
    }

    // 翻译单个商品
    async function translateSingleProduct(product) {
        try {
            // 准备要翻译的内容
            var scentStr = '';
            if (product.scent_notes && Array.isArray(product.scent_notes)) {
                scentStr = product.scent_notes.join(', ');
            }

            var items = [
                { label: '商品名稱', original: product.name_zh || '', field: 'name_en' },
                { label: '商品描述', original: product.description || '', field: 'description_en' },
                { label: '香調', original: scentStr, field: 'scent_notes_en', isArray: true },
                { label: '花材', original: product.specs_flowers || '', field: 'specs_flowers_en' },
                { label: '產地', original: product.specs_origin || '', field: 'specs_origin_en' },
                { label: '規格', original: product.specs_size || '', field: 'specs_size_en' }
            ];

            // 过滤掉空内容
            items = items.filter(function(item) { return item.original && item.original.trim(); });
            if (items.length === 0) return false;

            // 构建翻译请求
            var textToTranslate = items.map(function(item, i) {
                return (i + 1) + '. ' + item.label + ': ' + item.original;
            }).join('\n');

            // 调用AI翻译API
            var response = await fetch('/api/ai-translate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: textToTranslate, source_lang: 'zh', target_lang: 'en' })
            });

            if (!response.ok) throw new Error('API请求失败');
            var data = await response.json();
            var translatedText = data.translated || data.result || '';
            if (!translatedText) throw new Error('翻譯結果為空');

            // 解析翻译结果
            var lines = translatedText.split('\n').filter(function(line) { return line.trim(); });
            var updates = {};

            for (var i = 0; i < items.length; i++) {
                var item = items[i];
                var translated = '';

                // 尝试匹配 "1. 商品名稱: 翻译结果" 格式
                var pattern = new RegExp('^\\s*' + (i + 1) + '[.、:：]\\s*(.*)$');
                for (var j = 0; j < lines.length; j++) {
                    var match = lines[j].match(pattern);
                    if (match) {
                        translated = match[1].trim();
                        break;
                    }
                }

                // 如果没匹配到，尝试按顺序取
                if (!translated && lines[i]) {
                    translated = lines[i].replace(/^\s*\d+[.、:：]\s*/, '').trim();
                }

                if (translated) {
                    // 处理数组类型字段（香调）
                    if (item.isArray) {
                        updates[item.field] = translated.split(/[,，、]/).map(function(s) { return s.trim(); }).filter(function(s) { return s; });
                    } else {
                        updates[item.field] = translated;
                    }
                }
            }

            if (Object.keys(updates).length === 0) return false;

            // 保存到数据库
            await supabaseClient.from('products').update(updates).eq('id', product.id);
            return true;

        } catch (e) {
            console.error('翻译商品失败:', product.id, e);
            return false;
        }
    }

    // 工具函数
    function escapeHtml(text) {
        var div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    function showToast(message, type) {
        var toast = document.getElementById('toast');
        toast.textContent = message;
        toast.className = 'toast show ' + (type || '');
        setTimeout(function() { toast.className = 'toast'; }, 3000);
    }
    </script>
