    <style>
        .user-icon { display: flex; align-items: center; justify-content: center; padding: 5px; color: #1A1A1A; }

        .cart-section-content.open { display: block; }
        .card-options { display: flex; gap: 10px; flex-wrap: wrap; }

        .card-textarea { width: 100%; padding: 12px; border: 1px solid #1A1A1A; border-radius: 5px; font-size: 14px; font-family: inherit; resize: vertical; min-height: 80px; margin-top: 10px; background-color: white; }
        .form-input { width: 100%; padding: 12px; border: 1px solid #1A1A1A; border-radius: 5px; font-size: 14px; font-family: inherit; margin-bottom: 10px; background-color: white; }
        .coupon-input { display: flex; gap: 10px; }
        .coupon-input input { flex: 1; padding: 12px; border: 1px solid #1A1A1A; border-radius: 5px; font-size: 14px; font-family: inherit; }
        .coupon-btn { padding: 12px 20px; background-color: #1A1A1A; color: #FAF8F5; border: none; border-radius: 5px; cursor: pointer; font-family: inherit; }
        .cart-summary { background-color: #1A1A1A; color: #FAF8F5; padding: 30px; border-radius: 10px; margin-top: 30px; }
        .summary-row { display: flex; justify-content: space-between; margin-bottom: 15px; font-size: 16px; }
        .summary-row.total { font-size: 24px; font-weight: 700; border-top: 1px solid rgba(250,248,245,0.3); padding-top: 15px; margin-top: 15px; }
        .checkout-btn { width: 100%; padding: 16px; background-color: #FAF8F5; color: #1A1A1A; border: none; border-radius: 5px; font-size: 18px; font-weight: 700; cursor: pointer; font-family: inherit; margin-top: 20px; }
        .checkout-btn:hover { background-color: #F3EFEA; }
        .empty-cart { text-align: center; padding: 80px 20px; }
        .empty-cart-emoji { font-size: 80px; margin-bottom: 20px; }
        .empty-cart-text { font-size: 18px; color: #383431; margin-bottom: 30px; }
        .continue-shopping-btn { display: inline-block; padding: 15px 40px; background-color: #1A1A1A; color: #FAF8F5; border-radius: 5px; font-size: 16px; cursor: pointer; font-family: inherit; }

    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script>
    const SUPABASE_URL = 'https://gefqlrmozxbgfhxgngtg.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdlZnFscm1venhiZ2ZoeGduZ3RnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYyOTI0MDQsImV4cCI6MjEwMTg2ODQwNH0.oH0fI1xpKn6arQlpvznrXXMMWsD1ZxNazRP4LZeZ68Y';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    let cart = JSON.parse(localStorage.getItem('royalspl_cart') || '[]');
    let cardType = 'none';
    let cardMessage = '';
    let remarks = '';
    let contactName = '';
    let contactPhone = '';
    let customerEmail = '';
    let couponCode = '';

    function saveCart() { localStorage.setItem('royalspl_cart', JSON.stringify(cart)); updateCartBadge(); }
    function updateCartBadge() { const badge = document.getElementById('cartBadge'); if (badge) { const totalItems = cart.reduce((sum, item) => sum + (item.quantity || 0), 0); badge.textContent = totalItems; badge.style.display = totalItems > 0 ? 'flex' : 'none'; } }
    async function syncCartWithDatabase() {
        if (!cart.length) { renderCart(); return; }
        const productIds = cart.map(item => item.productId).filter(Boolean);
        if (!productIds.length) { renderCart(); return; }
        try {
            const { data, error } = await supabaseClient.from('products').select('*').in('id', productIds);
            if (error) throw error;
            const products = data || [];
            cart = cart.map(item => {
                const product = products.find(p => p.id === item.productId);
                if (product) {
                    return {
                        ...item,
                        name: product.name_zh,
                        nameEn: product.name_en || '',
                        price: product.price,
                        emoji: product.emoji || '🌸',
                        image: (product.images && product.images[0]) || product.image_url || ''
                    };
                }
                return item;
            });
            saveCart();
        } catch (e) {
            console.error('同步購物車失敗:', e);
        }
        renderCart();
    }

    function renderCart() {
        const container = document.getElementById('cartContent');
        if (!container) return;
        if (cart.length === 0) {
            container.innerHTML = `<div class="empty-cart"><p class="empty-cart-emoji">🛒</p><p class="empty-cart-text">您的花禮清單是空的</p><a href="products.html" class="continue-shopping-btn">去選購花藝</a></div>`;
            return;
        }
        let itemsHtml = cart.map((item, index) => {
            const addons = item.addons || [];
            const addonsTotal = addons.reduce((sum, a) => sum + (a.price || 0), 0);
            const itemTotal = ((item.price || 0) + addonsTotal) * (item.quantity || 1);
            const addonsHtml = addons.length > 0 ? `<p class="cart-item-addons">+ ${addons.map(a => a.name || '').join(', ')}</p>` : '';
            const itemImg = item.image ? `<img src="${item.image}" class="cart-item-image">` : `<span class="cart-item-emoji">${item.emoji || '🌸'}</span>`;
            return `<div class="cart-item">
                ${itemImg}
                <div class="cart-item-info">
                    <p class="cart-item-name">${item.name || '商品'}</p>
                    <p class="cart-item-name-en">${item.nameEn || ''}</p>
                    ${addonsHtml}
                    <p class="cart-item-price">HK$${itemTotal}</p>
                </div>
                <div class="cart-item-quantity">
                    <button class="qty-btn" onclick="changeQty(${index}, -1)">−</button>
                    <span class="qty-num">${item.quantity}</span>
                    <button class="qty-btn" onclick="changeQty(${index}, 1)">+</button>
                </div>
                <button class="cart-item-remove" onclick="removeItem(${index})">✕</button>
            </div>`;
        }).join('');
        const subtotal = cart.reduce((sum, item) => { const addons = item.addons || []; const addonsTotal = addons.reduce((a, addon) => a + (addon.price || 0), 0); return sum + ((item.price || 0) + addonsTotal) * (item.quantity || 1); }, 0);
        const cardSectionOpen = cardType === 'yes' || cardType === 'blank';
        const showTextarea = cardType === 'yes' || cardType === 'blank';
        container.innerHTML = `
            <div class="cart-items">${itemsHtml}</div>
            <div class="cart-section">
                <div class="cart-section-title" onclick="toggleSection(this)">需要心意卡嗎？<span>${cardSectionOpen ? '−' : '+'}</span></div>
                <div class="cart-section-content ${cardSectionOpen ? 'open' : ''}">
                    <div class="card-options">
                        <button class="card-option ${cardType === 'yes' ? 'active' : ''}" onclick="setCardType('yes')">需要</button>
                        <button class="card-option ${cardType === 'none' ? 'active' : ''}" onclick="setCardType('none')">不需要</button>
                        <button class="card-option ${cardType === 'blank' ? 'active' : ''}" onclick="setCardType('blank')">需要空白心意卡</button>
                    </div>
                    ${showTextarea ? `<textarea class="card-textarea" placeholder="請輸入祝福語..." oninput="cardMessage = this.value">${cardMessage}</textarea>` : ''}
                </div>
            </div>
            <div class="cart-section">
                <div class="cart-section-title" onclick="toggleSection(this)">訂購人聯絡方法（選填）<span>+</span></div>
                <div class="cart-section-content">
                    <div style="display:flex;gap:10px;flex-wrap:wrap;">
                        <input type="text" class="card-textarea" placeholder="訂購人姓名" style="flex:1;min-width:150px;padding:10px;border:1px solid #ddd;border-radius:5px;font-family:inherit;" oninput="contactName = this.value" value="${contactName}">
                        <input type="tel" class="card-textarea" placeholder="訂購人電話" style="flex:1;min-width:150px;padding:10px;border:1px solid #ddd;border-radius:5px;font-family:inherit;" oninput="contactPhone = this.value" value="${contactPhone}">
                    </div>
                </div>
            </div>
            <div class="cart-section">
                <div class="cart-section-title" onclick="toggleSection(this)">訂購人電郵（接收訂單通知）<span>+</span></div>
                <div class="cart-section-content">
                    <input type="email" class="card-textarea" placeholder="請輸入電郵地址" style="padding:10px;border:1px solid #ddd;border-radius:5px;font-family:inherit;margin-top:0;" oninput="customerEmail = this.value" value="${customerEmail}">
                </div>
            </div>
            <div class="cart-section">
                <div class="cart-section-title" onclick="toggleSection(this)">特別事項（選填）<span>+</span></div>
                <div class="cart-section-content"><textarea class="card-textarea" placeholder="請輸入特別事項..." oninput="remarks = this.value">${remarks}</textarea></div>
            </div>
            <div class="cart-section">
                <div class="cart-section-title" onclick="toggleSection(this)">優惠碼<span>+</span></div>
                <div class="cart-section-content"><div class="coupon-input"><input type="text" id="couponInput" placeholder="輸入優惠碼" oninput="couponCode = this.value" value="${couponCode}"><button class="coupon-btn" onclick="applyCoupon()">套用</button></div></div>
            </div>
            <div class="cart-summary">
                <div class="summary-row"><span>商品小計</span><span>HK$${subtotal}</span></div>
                <div class="summary-row"><span>運費</span><span>結帳時計算</span></div>
                <div class="summary-row total"><span>總計</span><span>HK$${subtotal}</span></div>
                <button class="checkout-btn" onclick="goCheckout()">前往結帳</button>
            </div>
        `;
    }
    function changeQty(index, delta) { cart[index].quantity = Math.max(1, (cart[index].quantity || 1) + delta); saveCart(); renderCart(); }
    function removeItem(index) { cart.splice(index, 1); saveCart(); renderCart(); }
    function setCardType(type) {
        cardType = type;
        const cardOptions = document.querySelectorAll('.card-option');
        const cardContent = document.querySelector('.cart-section-content');
        const existingTextarea = cardContent ? cardContent.querySelector('.card-textarea') : null;
        cardOptions.forEach(btn => {
            btn.classList.remove('active');
            if ((type === 'yes' && btn.textContent === '需要') || (type === 'none' && btn.textContent === '不需要') || (type === 'blank' && btn.textContent === '需要空白心意卡')) { btn.classList.add('active'); }
        });
        const shouldOpen = type === 'yes' || type === 'blank';
        const sectionTitle = document.querySelector('.cart-section-title');
        if (shouldOpen) {
            cardContent.classList.add('open');
            const span = sectionTitle.querySelector('span');
            if (span) span.textContent = '−';
            if (!existingTextarea) {
                const textarea = document.createElement('textarea');
                textarea.className = 'card-textarea';
                textarea.placeholder = '請輸入祝福語...';
                textarea.value = cardMessage;
                textarea.addEventListener('input', function() { cardMessage = this.value; });
                cardContent.appendChild(textarea);
            }
        } else {
            cardContent.classList.remove('open');
            const span = sectionTitle.querySelector('span');
            if (span) span.textContent = '+';
            if (existingTextarea) { existingTextarea.remove(); }
        }
    }
    function toggleSection(element) { const content = element.nextElementSibling; content.classList.toggle('open'); const span = element.querySelector('span'); if (span) span.textContent = content.classList.contains('open') ? '−' : '+'; }
    function goCheckout() {
        if (cart.length === 0) {
            const toast = document.createElement('div');
            toast.style.cssText = 'position:fixed;top:20px;right:20px;background:#1A1A1A;color:#FAF8F5;padding:15px 25px;border-radius:5px;z-index:9999;';
            toast.textContent = '購物車為空，請先添加商品';
            document.body.appendChild(toast); setTimeout(() => toast.remove(), 2500);
            return;
        }
        // 保存额外订单信息到 localStorage
        localStorage.setItem('order_extra', JSON.stringify({
            cardMessage: cardMessage,
            remarks: remarks,
            contactName: contactName,
            contactPhone: contactPhone,
            customerEmail: customerEmail,
            couponCode: couponCode
        }));
        
        // GA4 + Google Ads: begin_checkout 事件
        if (typeof gtag === 'function') {
            var cartTotal = 0;
            var cartItems = cart.map(function(item) {
                cartTotal += item.price * item.quantity;
                return {
                    item_id: item.productId,
                    item_name: item.name,
                    price: item.price,
                    quantity: item.quantity
                };
            });
            gtag('event', 'begin_checkout', {
                currency: 'HKD',
                value: cartTotal,
                items: cartItems
            });
        }
        
        window.location.href = 'checkout.html';
    }
    const menuBtn = document.getElementById('menuBtn');
    const navCloseBtn = document.getElementById('navCloseBtn');
    const navDrawer = document.getElementById('navDrawer');
    if (menuBtn) menuBtn.addEventListener('click', function() { navDrawer.classList.add('open'); });
    if (navCloseBtn) navCloseBtn.addEventListener('click', function() { navDrawer.classList.remove('open'); });
    document.addEventListener('DOMContentLoaded', function() { updateCartBadge(); syncCartWithDatabase(); });
    </script>
    <script>
    (function() {
        fetch('/track-visit', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ page_name: document.title || '未知頁面' })
        }).catch(function() {});
    })();
    </script>
