        dv.innerHTML = '<div class="page-header"><button class="btn btn-secondary" onclick="showCategoryList()">返回列表</button><h2 class="page-title">' + category.name_zh + '</h2><button class="btn btn-primary" onclick="saveCategoryDetail()">保存所有更改</button></div>';
        dv.innerHTML += '<div class="form-container" style="max-width:100%;margin-bottom:20px;"><input type="hidden" id="categoryDetailId" value="' + category.id + '">';
        dv.innerHTML += '<div class="category-detail-image-row"><div class="category-image-upload-wrap"><label class="form-label">分類圖片</label><div class="upload-area category-upload-area" id="categoryDetailUploadArea"><p>點擊更換圖片</p><input type="file" id="categoryDetailFileInput" accept="image/*" style="display:none;"></div></div><div class="category-image-preview-wrap"><label class="form-label">圖片預覽</label><div class="category-image-preview" id="categoryDetailImagePreview">' + (category.image_url ? '<img src="' + category.image_url + '">' : '<span class="category-image-preview-empty">未上傳</span>') + '</div></div></div>';
        dv.innerHTML += '<div><div class="form-group"><label class="form-label">中文名稱</label><input class="form-input" id="categoryDetailNameZh" value="' + (category.name_zh || '') + '"></div><div class="form-group"><label class="form-label">英文名稱</label><input class="form-input" id="categoryDetailNameEn" value="' + (category.name_en || '') + '"></div></div></div>';
        dv.innerHTML += '<div class="form-group"><label class="form-label">文案簡介</label><textarea class="form-textarea" id="categoryDetailDescription">' + (category.description || '') + '</textarea></div></div>';
        dv.innerHTML += '<div class="page-header"><h3 style="font-size:20px;font-weight:600;">分類內商品</h3><button class="btn btn-primary" onclick="openProductSelectForCategory()">添加商品</button></div><div class="category-products-grid" id="categoryProductsGrid"></div><p style="font-size:14px;color:#888;margin-top:10px;">拖拽商品卡片調整順序，完成後點擊保存</p>';
        categoryDetailUploadedImage = category.image_url || '';
        initCategoryDetailUpload();
        await loadCategoryProducts(categoryId);
    }
    function initCategoryDetailUpload() { var ua = document.getElementById('categoryDetailUploadArea'); var fi = document.getElementById('categoryDetailFileInput'); if (ua && fi) { ua.onclick = function() { fi.click(); }; fi.onchange = function() { handleCategoryDetailFileUpload(this.files[0]); }; } }
    async function handleCategoryDetailFileUpload(file) { if (!file) return; var fd = new FormData(); fd.append('file', file); try { var res = await fetch('/r2-upload', { method: 'POST', body: fd }); var data = await res.json(); if (data.url) { categoryDetailUploadedImage = data.url; var preview = document.getElementById('categoryDetailImagePreview'); if (preview) preview.innerHTML = '<img src="' + data.url + '">'; showToast('圖片已上傳'); } else { showToast('圖片上傳失敗'); } } catch (e) { showToast('圖片上傳失敗：' + e.message); } }
    async function loadCategoryProducts(categoryId) { try { var r = await supabaseClient.from('products').select('*').contains('category_ids', [categoryId]).order('sort_order_in_category', { ascending: true }); if (r.error) { categoryDetailProducts = []; } else { categoryDetailProducts = r.data || []; } } catch (e) { categoryDetailProducts = []; } renderCategoryProductsList(); }
    function renderCategoryProductsList() {
        var c = document.getElementById('categoryProductsGrid');
        if (!c) return;
        if (!categoryDetailProducts.length) { c.innerHTML = '<div class="empty-state">暫無商品</div>'; return; }
        var h = '';
        for (var i = 0; i < categoryDetailProducts.length; i++) {
            var p = categoryDetailProducts[i];
            h += '<div class="category-product-card" draggable="true" data-index="' + i + '" ondragstart="productDragStart(event)" ondragover="productDragOver(event)" ondrop="productDrop(event)" ondragend="productDragEnd(event)">';
            h += p.image_url ? '<img src="' + p.image_url + '">' : '<div style="height:140px;background:#F3EFEA;display:flex;align-items:center;justify-content:center;">無圖</div>';
            h += '<div class="category-product-card-body"><p style="font-size:15px;font-weight:600;">' + p.name_zh + '</p><p style="font-size:14px;color:#383431;">HK$' + p.price + '</p><button class="category-product-card-remove" onclick="removeProductFromCategory(' + p.id + ')">移除</button></div></div>';
        }
        c.innerHTML = h;
    }
    var draggedProductIndex = null;
    function getDragIndex(e) { var card = (e.target && e.target.closest) ? e.target.closest('.category-product-card') : null; return card ? parseInt(card.getAttribute('data-index')) : null; }
    function productDragStart(e) { draggedProductIndex = getDragIndex(e); if (draggedProductIndex !== null) { var card = e.target.closest('.category-product-card'); if (card) card.classList.add('dragging'); } }
    function productDragOver(e) { e.preventDefault(); }
    function productDragEnd(e) { var cards = document.querySelectorAll('.category-product-card'); for (var i = 0; i < cards.length; i++) cards[i].classList.remove('dragging'); draggedProductIndex = null; }
    function productDrop(e) { e.preventDefault(); var targetIndex = getDragIndex(e); if (draggedProductIndex === null || targetIndex === null || draggedProductIndex === targetIndex) { draggedProductIndex = null; return; } var temp = categoryDetailProducts[draggedProductIndex]; categoryDetailProducts.splice(draggedProductIndex, 1); categoryDetailProducts.splice(targetIndex, 0, temp); renderCategoryProductsList(); showToast('順序已調整，請點擊保存'); }
    function removeProductFromCategory(productId) { if (!confirm('從分類中移除？')) return; categoryDetailProducts = categoryDetailProducts.filter(function(p) { return p.id !== productId; }); renderCategoryProductsList(); showToast('已移除，請點擊保存'); }
    async function saveCategoryDetail() {
        var saveBtn = null;
        var btns = document.querySelectorAll('.page-header .btn-primary');
        for (var bi = 0; bi < btns.length; bi++) { if (btns[bi].textContent.indexOf('保存') > -1) saveBtn = btns[bi]; }
        if (saveBtn) { saveBtn.disabled = true; saveBtn.textContent = '保存中...'; }
        try {
        var categoryId = parseInt(document.getElementById('categoryDetailId').value);
        var categoryData = { name_zh: document.getElementById('categoryDetailNameZh').value.trim(), name_en: document.getElementById('categoryDetailNameEn').value.trim(), description: document.getElementById('categoryDetailDescription').value.trim(), image_url: categoryDetailUploadedImage || null };
        var catResp = await supabaseClient.from('categories').update(categoryData).eq('id', categoryId);
        if (catResp.error) { showToast('保存失敗：' + catResp.error.message); if (saveBtn) { saveBtn.disabled = false; saveBtn.textContent = '保存所有更改'; } return; }
        var categoryName = document.getElementById('categoryDetailNameZh').value.trim();
        // 获取当前在该分类下的所有商品
        var existing = await supabaseClient.from('products').select('id,category_ids,categories').contains('category_ids', [categoryId]);
        var existingIds = [];
        var existingMap = {};
        if (existing.data) {
            for (var i = 0; i < existing.data.length; i++) {
                existingIds.push(existing.data[i].id);
                existingMap[existing.data[i].id] = existing.data[i];
            }
        }
        var newIds = [];
        for (var j = 0; j < categoryDetailProducts.length; j++) { newIds.push(categoryDetailProducts[j].id); }
        // 移除不再属于该分类的商品
        for (var k = 0; k < existingIds.length; k++) {
            if (newIds.indexOf(existingIds[k]) === -1) {
                var p = existingMap[existingIds[k]];
                var newCatIds = (p.category_ids || []).filter(function(id) { return id !== categoryId; });
                var newCatNames = (p.categories || []).filter(function(n) { return n !== categoryName; });
                var rmResp = await supabaseClient.from('products').update({ category_ids: newCatIds, categories: newCatNames, category: newCatNames.join(', '), category_id: newCatIds.length > 0 ? newCatIds[0] : null }).eq('id', existingIds[k]);
                if (rmResp.error) { showToast('移除商品失敗：' + rmResp.error.message); }
            }
        }
        // 添加新商品到该分类
        for (var m = 0; m < categoryDetailProducts.length; m++) {
            var pid = categoryDetailProducts[m].id;
            var prod = existingMap[pid];
            var catIds = prod ? (prod.category_ids || []) : [];
            var catNames = prod ? (prod.categories || []) : [];
            if (catIds.indexOf(categoryId) === -1) { catIds.push(categoryId); catNames.push(categoryName); }
            var addResp = await supabaseClient.from('products').update({ category_ids: catIds, categories: catNames, category: catNames.join(', '), category_id: catIds.length > 0 ? catIds[0] : null, sort_order_in_category: m + 1 }).eq('id', pid);
            if (addResp.error) { showToast('保存商品失敗：' + addResp.error.message); }
        }
        if (saveBtn) { saveBtn.disabled = false; saveBtn.textContent = '保存所有更改'; }
        showToast('✅ 所有更改已保存'); showCategoryList();
        } catch (saveErr) { showToast('保存失敗：' + (saveErr.message || saveErr)); if (saveBtn) { saveBtn.disabled = false; saveBtn.textContent = '保存所有更改'; } }
    }
    
    async function openProductSelectForCategory() {
        var categoryId = parseInt(document.getElementById('categoryDetailId').value);
        document.getElementById('modalCategoryId').value = 'category_' + categoryId;
        var c = document.getElementById('modalProductList');
        var currentIds = [];
        for (var i = 0; i < categoryDetailProducts.length; i++) { currentIds.push(categoryDetailProducts[i].id); }
        selectedCategoryProducts = currentIds.slice();
        document.getElementById('productSelectModal').classList.add('show');
        c.innerHTML = '<div class="empty-state" style="padding:30px;">載入商品中...</div>';
        // 主動從數據庫加載商品，避免依賴 allProducts（可能未加載）
        var prodList = [];
        try {
            var pr = await supabaseClient.from('products').select('*').order('id', { ascending: true });
            prodList = pr.data || [];
            allProducts = prodList; // 同步全局，供 saveCategoryProducts 使用
        } catch (e) { prodList = []; }
        if (!prodList.length) { c.innerHTML = '<div class="empty-state" style="padding:30px;">暫無商品，請先到「商品管理」新增商品</div>'; return; }
        var h = '';
        for (var j = 0; j < prodList.length; j++) {
            var p = prodList[j];
            var checked = selectedCategoryProducts.indexOf(p.id) > -1 ? 'checked' : '';
            h += '<label class="modal-product-item"><input type="checkbox" value="' + p.id + '" ' + checked + ' onchange="toggleCategoryProduct(' + p.id + ')">' + (p.image_url ? '<img src="' + p.image_url + '">' : '<span>無圖</span>') + p.name_zh + ' (HK$' + p.price + ')</label>';
        }
        c.innerHTML = h;
    }
    function toggleCategoryProduct(id) { var idx = selectedCategoryProducts.indexOf(id); if (idx > -1) { selectedCategoryProducts.splice(idx, 1); } else { selectedCategoryProducts.push(id); } }
    function closeProductModal() { document.getElementById('productSelectModal').classList.remove('show'); }
    async function saveCategoryProducts() { categoryDetailProducts = []; for (var i = 0; i < selectedCategoryProducts.length; i++) { var pid = selectedCategoryProducts[i]; for (var j = 0; j < allProducts.length; j++) { if (allProducts[j].id === pid) { categoryDetailProducts.push(allProducts[j]); break; } } } renderCategoryProductsList(); showToast('商品已添加，請點擊保存'); closeProductModal(); }
    function getCheckedCategoryIds() { var ids = []; document.querySelectorAll('.category-card-check:checked').forEach(function(cb) { ids.push(parseInt(cb.value)); }); return ids; }
    async function bulkCategoryDelete() { var ids = getCheckedCategoryIds(); if (!ids.length) { showToast('請先勾選'); return; } await supabaseClient.from('categories').delete().in('id', ids); showToast('完成'); loadCategories(); }
    async function bulkCategoryActive(active) { var ids = getCheckedCategoryIds(); if (!ids.length) { showToast('請先勾選'); return; } await supabaseClient.from('categories').update({ is_active: active }).in('id', ids); showToast('完成'); loadCategories(); }
    </script>
        <script>
    // ==================== 訂單管理 ====================
    function renderOrdersPage(c) {
        c.innerHTML = '<div class="page-header"><h2 class="page-title">訂單管理</h2><div class="btn-group"><button class="btn btn-secondary" onclick="exportOrdersCSV()">導出 CSV</button><button class="btn btn-primary" onclick="showAddOrderForm()">新增訂單</button></div></div><div class="btn-group" style="margin-bottom:15px;"><select id="orderStatusFilter" onchange="filterOrdersByStatus()" style="padding:8px 12px;border:1px solid #1A1A1A;border-radius:5px;"><option value="all">全部狀態</option><option value="unpaid">未付款</option><option value="pending_payment">待確認付款</option><option value="paid">已付款</option><option value="shipped">已出貨</option></select><button class="btn btn-danger btn-small" onclick="bulkDeleteOrders()">批量刪除</button></div><div id="ordersTable"></div><div id="addOrderFormContainer" style="display:none;"></div><div id="orderDetailView" style="display:none;"></div>';
        loadOrders();
    }
    async function loadOrders() {
        var c = document.getElementById('ordersTable');
        if (!c) return;
        try {
            var r = await supabaseClient.from('orders').select('*').order('created_at', { ascending: false });
            allOrders = r.data || [];
            renderOrdersTable(allOrders);
        } catch (e) { c.innerHTML = '暫無訂單'; }
    }
    function renderOrdersTable(orders) {
        var c = document.getElementById('ordersTable');
        if (!orders.length) { c.innerHTML = '<div class="empty-state">暫無訂單</div>'; return; }
        var h = '<table class="data-table"><thead><tr><th class="checkbox-col"><input type="checkbox" id="checkAllOrders" onchange="toggleCheckAllOrders()"></th><th>訂單編號</th><th>成立日期</th><th>送貨日期</th><th>收花人</th><th>電話</th><th>總金額</th><th>狀態</th><th>操作</th></tr></thead><tbody>';
        for (var i = 0; i < orders.length; i++) {
            var o = orders[i];
            h += '<tr><td class="checkbox-col"><input type="checkbox" class="order-check" value="' + o.id + '"></td>';
            h += '<td>' + o.order_code + '</td><td>' + (o.created_at || '').slice(0,10) + '</td><td>' + (o.delivery_date || '-') + '</td><td>' + o.recipient_name + '</td><td>' + o.recipient_phone + '</td><td>HK$' + o.total_amount + '</td>';
            h += '<td><select onchange="updateOrderStatus(' + o.id + ', this.value)" style="padding:5px;border:1px solid #1A1A1A;border-radius:3px;"><option value="unpaid"' + (o.status === 'unpaid' ? ' selected' : '') + '>未付款</option><option value="pending_payment"' + (o.status === 'pending_payment' ? ' selected' : '') + '>待確認付款</option><option value="paid"' + (o.status === 'paid' ? ' selected' : '') + '>已付款</option><option value="shipped"' + (o.status === 'shipped' ? ' selected' : '') + '>已出貨</option></select></td>';
            var actionBtns = '<button class="btn btn-secondary btn-small" onclick="openOrderDetail(' + o.id + ')">詳情</button> ';
            actionBtns += '<button class="btn btn-secondary btn-small" onclick="downloadOrderPDFById(' + o.id + ')">PDF</button> ';
            actionBtns += '<button class="btn btn-secondary btn-small" onclick="copyOrderDetail(' + o.id + ')">複製轉發</button> ';
            if (o.status === 'unpaid') { actionBtns += '<button class="btn btn-primary btn-small" onclick="createStripePayment(' + o.id + ')">收款</button> '; }
            if (o.status === 'pending_payment') { actionBtns += '<button class="btn btn-success btn-small" onclick="markOrderPaid(' + o.id + ')">核對付款</button> '; }
            if (o.status === 'paid' && o.stripe_payment_intent_id) { actionBtns += '<button class="btn btn-danger btn-small" onclick="showRefundForm(' + o.id + ')">退款</button> '; }
            h += '<td><div class="btn-group">' + actionBtns + '</div></td></tr>';
        }
        h += '</tbody></table>';
        c.innerHTML = h;
    }
    function filterOrdersByStatus() { var f = document.getElementById('orderStatusFilter').value; if (f === 'all') { renderOrdersTable(allOrders); } else { renderOrdersTable(allOrders.filter(function(o) { return o.status === f; })); } }

        var text = '訂單編號：' + o.order_code + '\n送貨日期：' + (o.delivery_date || '-') + '\n收件人：' + o.recipient_name + '\n電話：' + o.recipient_phone + '\n';
        if (o.customer_email) { text += 'Email：' + o.customer_email + '\n'; }
        text += '地址：' + o.recipient_address + '\n產品：' + (o.product_names || '') + '\n總金額：HK$' + o.total_amount + '\n狀態：' + o.status;
        if (navigator.clipboard) { navigator.clipboard.writeText(text).then(function() { showToast('訂單詳情已複製'); }); }
        else { var ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); showToast('訂單詳情已複製'); }

    async function createStripePayment(orderId) {
        var order = null;
        for (var i = 0; i < allOrders.length; i++) { if (allOrders[i].id === orderId) { order = allOrders[i]; break; } }
        if (!order) return;
        try {
            var res = await fetch('/stripe-payment', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'create_payment', orderId: order.id, amount: order.total_amount, orderCode: order.order_code }) });
            var data = await res.json();
            if (data.url) { window.open(data.url, '_blank'); showToast('支付連結已生成'); } else { showToast('生成失敗：' + (data.error || '未知錯誤')); }
        } catch (e) { showToast('網絡錯誤'); }
    }
    function showRefundForm(orderId) {
        var order = null;
        for (var i = 0; i < allOrders.length; i++) { if (allOrders[i].id === orderId) { order = allOrders[i]; break; } }
        if (!order) return;
        var amount = prompt('退款金額 (HKD)：\n全額退款請輸入 ' + order.total_amount + '\n部分退款請輸入金額', order.total_amount);
        if (!amount) return;
        var refundAmount = parseFloat(amount);
        if (refundAmount <= 0) { showToast('請輸入有效金額'); return; }
        if (refundAmount > order.total_amount) { showToast('退款金額不能超過訂單總額'); return; }
        processRefund(order, refundAmount);
    }
    async function processRefund(order, refundAmount) {
        try {
            var res = await fetch('/stripe-payment', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'refund', paymentIntentId: order.stripe_payment_intent_id, refundAmount: refundAmount }) });
            var data = await res.json();
            if (data.success) { await supabaseClient.from('orders').update({ refund_status: 'refunded', status: 'cancelled' }).eq('id', order.id); showToast('退款成功'); loadOrders(); } else { showToast('退款失敗：' + (data.error || '未知錯誤')); }
        } catch (e) { showToast('網絡錯誤'); }
    }
    function exportOrdersCSV() {
        if (!allOrders || !allOrders.length) { alert('暫無訂單可導出'); return; }
        var headers = ['訂單編號','下單時間','送貨日期','送貨時段','送貨小時','送貨區域','運費','商品小計','訂單總額','訂單狀態','付款方式','收貨人姓名','收貨人電話','收貨地址','訂購人姓名','訂購人電話','訂購人電郵','備註','心意卡內容','商品名稱','Stripe付款ID','退款狀態','FPS參考號','FPS截圖','用戶ID','訂單ID'];
        var rows = [headers.join(',')];
        for (var i = 0; i < allOrders.length; i++) {
            var o = allOrders[i];
            var row = [
                o.order_code || '',
                (o.created_at || '').replace('T',' ').slice(0,19),
                o.delivery_date || '',
                o.delivery_time_slot || '',
                o.delivery_hour || '',
                o.delivery_area || '',
                o.delivery_fee || '',
                o.subtotal || '',
                o.total_amount || '',
                o.status || '',
                o.payment_method || '',
                o.recipient_name || '',
                o.recipient_phone || '',
                (o.recipient_address || '').replace(/,/g, '，'),
                o.customer_name || '',
                o.customer_phone || '',
                o.customer_email || '',
                (o.remarks || '').replace(/,/g, '，'),
                (o.card_message || '').replace(/,/g, '，'),
                (o.product_names || '').replace(/,/g, '，'),
                o.stripe_payment_intent_id || '',
                o.refund_status || '',
                o.fps_ref || '',
                o.fps_screenshot || '',
                o.user_id || '',
                o.id || ''
            ];
            rows.push(row.map(function(v) { return '"' + String(v).replace(/"/g, '""') + '"'; }).join(','));
        }
        var blob = new Blob(['\ufeff' + rows.join('\n')], { type: 'text/csv;charset=utf-8;' });
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'orders_' + new Date().toISOString().slice(0,10) + '.csv';
        a.click();
    }

    async function saveShopSettings() {

    async function loadMemberOrderStats(memberId) {
        try {
            var member = allMembers.find(function(m) { return m.id === memberId; });
            if (!member) return;
            var r = await supabaseClient.from('orders').select('total_amount,status').eq('user_id', memberId);
            var orders = r.data || [];
            var paidOrders = orders.filter(function(o) { return o.status === 'paid'; });
            var count = paidOrders.length;
            var total = paidOrders.reduce(function(sum, o) { return sum + (parseFloat(o.total_amount) || 0); }, 0);
            document.getElementById('md_order_count').textContent = count;
            document.getElementById('md_total_spent').textContent = 'HK$' + total.toFixed(2);
            // 更新数据库
            await supabaseClient.from('profiles').update({ order_count: count, total_spent: total }).eq('id', memberId);
        } catch(e) { console.error('加载订单统计失败', e); }

        var selector = document.getElementById('mo_product_selector');

                } catch(e) { img = ''; }
                var isSelected = manualOrderProducts.some(function(mp) { return mp.id === p.id; });
                html += '<div style="border:1px solid ' + (isSelected ? '#1A1A1A' : '#eee') + ';border-radius:8px;padding:8px;cursor:pointer;background:' + (isSelected ? '#f0f0f0' : '#fff') + ';" onclick="selectManualProduct(\'' + p.id + '\', \'' + (p.name || '').replace(/'/g, "\\'") + '\', ' + (p.price || 0) + ')">';

                html += '<div style="font-size:12px;color:#888;">HK$' + (p.price || 0) + '</div>';

    function selectManualProduct(id, name, price) {
        var idx = manualOrderProducts.findIndex(function(p) { return p.id === id; });
        if (idx >= 0) {
            manualOrderProducts.splice(idx, 1);
        } else {
            manualOrderProducts.push({ id: id, name: name, price: parseFloat(price) || 0, quantity: 1 });
        }
        updateManualOrderTotal();
        loadProductSelector(); // 刷新选中状态
    }
    
    function updateManualOrderTotal() {
        var total = manualOrderProducts.reduce(function(sum, p) { return sum + p.price * p.quantity; }, 0);
        var manualAmount = parseFloat(document.getElementById('mo_amount')?.value) || 0;
        var finalTotal = manualAmount > 0 ? manualAmount : total;
        var display = document.getElementById('mo_total_display');
        if (display) display.textContent = finalTotal.toFixed(2);
        var count = document.getElementById('mo_selected_count');
        if (count) count.textContent = manualOrderProducts.length > 0 ? '已選 ' + manualOrderProducts.length + ' 件商品' : '未選擇商品';
    }

    async function createManualOrder(memberId) {
        var manualAmount = parseFloat(document.getElementById('mo_amount')?.value) || 0;
        var remark = document.getElementById('mo_remark')?.value || '';
        var cardMessage = document.getElementById('mo_card_message')?.value || '';
        
        // 计算总价
        var productsTotal = manualOrderProducts.reduce(function(sum, p) { return sum + p.price * p.quantity; }, 0);
        var amount = manualAmount > 0 ? manualAmount : productsTotal;
        
        if (!amount || amount <= 0) { alert('请选择商品或输入有效的订单金额'); return; }
        
        try {
            var member = allMembers.find(function(m) { return m.id === memberId; });
            var orderCode = 'RS' + Date.now().toString().slice(-8);
            
            // 商品明细
            var items = manualOrderProducts.map(function(p) {
                return { product_id: p.id, name: p.name, price: p.price, quantity: p.quantity };
            });
            var productNames = manualOrderProducts.map(function(p) { return p.name; }).join(', ') || '手動建立訂單';
            
            // 创建订单
            var { data: order } = await supabaseClient.from('orders').insert({
                order_code: orderCode,
                user_id: memberId,
                customer_name: member ? member.full_name : '',
                customer_email: member ? member.email : '',
                customer_phone: member ? member.phone : '',
                recipient_name: member ? member.full_name : '',
                recipient_phone: member ? member.phone : '',
                recipient_address: member ? member.shipping_address : '',
                subtotal: amount,
                delivery_fee: 0,
                total_amount: amount,
                status: 'unpaid',
                remarks: remark || '手動建立訂單',
                card_message: cardMessage,
                product_names: productNames,
                items: items
            }).select().single();
            
            // 创建 Stripe Checkout Session
            var resp = await fetch('/create-checkout-session', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    orderId: order.id,
                    orderCode: orderCode,
                    amount: amount,
                    customerEmail: member ? member.email : '',
                    customerName: member ? member.full_name : ''
                })
            });
            var result = await resp.json();
            if (result.url) {
                alert('訂單已建立！付款鏈接：\n' + result.url + '\n\n請複製發送給客人');
                if (navigator.clipboard) { navigator.clipboard.writeText(result.url); }
                // 清空选择
                manualOrderProducts = [];
            } else {
                alert('訂單已建立，但付款鏈接生成失敗：' + (result.error || '未知错误'));
            }
        } catch(e) { alert('建立訂單失敗：' + e.message); }
    }

    async function importMembersCSV(input) {
        var file = input.files[0];
        if (!file) return;
        var reader = new FileReader();
        reader.onload = async function(e) {
            var text = e.target.result;
            var lines = text.split('\n').filter(function(l) { return l.trim(); });
            if (lines.length < 2) { alert('CSV 格式錯誤'); return; }
            
            function parseCSVLine(line) {
                var result = [];
                var current = '';
                var inQuotes = false;
                for (var i = 0; i < line.length; i++) {
                    var char = line[i];
                    if (char === '"') { inQuotes = !inQuotes; }
                    else if (char === ',' && !inQuotes) { result.push(current); current = ''; }
                    else { current += char; }
                }
                result.push(current);
                return result.map(function(v) { return v.trim(); });
            }
            
            var headers = parseCSVLine(lines[0]);
            var members = [];
            
            for (var i = 1; i < lines.length; i++) {
                var vals = parseCSVLine(lines[i]);
                var row = {};
                headers.forEach(function(h, idx) { row[h] = (vals[idx] || '').trim(); });
                
                var fullName = (row['名字'] || '') + ' ' + (row['姓氏'] || '');
                fullName = fullName.trim();
                var shippingAddr = [row['地址 1 - 街道'], row['地址 1 - 城市'], row['地址 1 - 郵遞區號'], row['地址 1 - 國家']].filter(Boolean).join(', ');
                var billingAddr = [row['地址 2 - 街道'], row['地址 2 - 城市'], row['地址 2 - 郵遞區號'], row['地址 2 - 國家']].filter(Boolean).join(', ');
                var email = row['電子郵件 1'] || row['電子郵件'] || '';
                if (!email) continue;
                
                members.push({
                    full_name: fullName,
                    email: email,
                    phone: row['電話 1'] || row['電話'] || '',
                    phone2: row['電話 2'] || '',
                    shipping_address: shippingAddr,
                    billing_address: billingAddr,
                    member_status: 'active',
                    tags: '',
                    source: row['來源'] || 'Wix 商店',
                    email_subscription: row['電子郵件訂閱者狀態'] || '未訂閱',
                    sms_subscription: row['簡訊訂閱者狀態'] || '未訂閱',
                    language: row['語言'] || 'zh',
                    last_active: row['上次活動日期 (UTC+0)'] || new Date().toISOString(),
                    created_at: row['建立時間 (UTC+0)'] || new Date().toISOString()
                });
            }
            
            if (members.length === 0) { alert('沒有有效的會員資料'); return; }
            if (!confirm('即將匯入 ' + members.length + ' 位會員，並為每位會員創建登錄賬號及發送設置密碼郵件，是否繼續？')) return;
            
            try {
                var resp = await fetch('/import-members', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ members: members })
                });
                var result = await resp.json();
                if (result.error) {
                    alert('匯入失敗：' + result.error + '\n\n請確認 Cloudflare Pages 已配置 SUPABASE_SERVICE_ROLE_KEY 環境變量');
                } else {
                    var msg = '匯入完成！\n成功：' + result.success + ' 位\n失敗：' + result.failed + ' 位';
                    if (result.errors && result.errors.length > 0) {
                        msg += '\n\n失敗詳情：' + result.errors.map(function(e) { return e.email + ': ' + e.error; }).join('\n');
                    }
                    alert(msg);
                }
                loadMembersList();
            } catch(err) {
                alert('匯入失敗：' + err.message + '\n\n如在本地測試，請部署到 Cloudflare Pages 後再使用');
            }
        };
        reader.readAsText(file);
        input.value = '';
    }

        var subtotal = unitPrice * qty;
        var total = subtotal + deliveryFee;

        var productName = selectedTemplateProduct ? selectedTemplateProduct.name_zh : '';
        var html = '<div class="template-preview-content">';
        var logo = document.getElementById('tplShopLogo').value;

        html += '<p style="text-align:center;">訂單確認書</p>';
        html += '<table><tr><td><b>訂單編號：</b>' + (document.getElementById('tplOrderCode').value || '') + '</td><td><b>送貨日期：</b>' + (document.getElementById('tplDeliveryDate').value || '') + '</td></tr>';
        html += '<tr><td><b>訂購人：</b>' + (document.getElementById('tplCustomerName').value || '') + '</td><td><b>電話：</b>' + (document.getElementById('tplCustomerPhone').value || '') + '</td></tr>';
        html += '<tr><td><b>收件人：</b>' + (document.getElementById('tplRecipientName').value || '') + '</td><td><b>收件人電話：</b>' + (document.getElementById('tplRecipientPhone').value || '') + '</td></tr>';

        html += '<tr><td>' + (productImg ? '<img src="' + productImg + '" style="width:60px;height:60px;object-fit:cover;border-radius:5px;">' : '無圖') + '</td>';
        html += '<td>' + productName + '</td><td style="text-align:center;">' + qty + '</td><td style="text-align:right;">HK$' + unitPrice + '</td><td style="text-align:right;">HK$' + subtotal + '</td></tr></table>';
        html += '<table style="width:50%;margin-left:auto;"><tr><td>運費：</td><td style="text-align:right;">HK$' + deliveryFee + '</td></tr>';
        html += '<tr style="font-size:20px;font-weight:bold;"><td>總計：</td><td style="text-align:right;">HK$' + total + '</td></tr></table>';
        var cardMsg = document.getElementById('tplCardMessage').value;
        if (cardMsg) { html += '<div style="background:#FFF8E1;padding:15px;border-left:4px solid #FFC107;margin:20px 0;"><b>心意卡：</b>' + cardMsg + '</div>'; }
        var remarks = document.getElementById('tplRemarks').value;
        if (remarks) { html += '<div style="background:#F5F5F5;padding:15px;margin:20px 0;"><b>特別事項：</b>' + remarks + '</div>'; }
        html += '<p style="text-align:center;margin-top:30px;color:#666;">' + (document.getElementById('tplShopName').value || '') + ' | ' + (document.getElementById('tplShopPhone').value || '') + '</p>';
        html += '<p style="text-align:center;color:#666;">' + (document.getElementById('tplShopAddress').value || '') + '</p>';
        html += '</div>';
        preview.innerHTML = html;
    }
    function downloadTemplatePDF() {
        renderTemplatePreview();
        var w = window.open('', '_blank');
        w.document.write('<html><head><title>訂單收據</title></head><body>' + document.getElementById('templatePreview').innerHTML + '</body></html>');

    function showToast(msg) {
        var toast = document.createElement('div');
        toast.className = 'toast';
        toast.textContent = msg;
        document.body.appendChild(toast);
        setTimeout(function() { toast.classList.add('show'); }, 10);
        setTimeout(function() { toast.classList.remove('show'); setTimeout(function() { toast.remove(); }, 300); }, 2500);
    }

    document.addEventListener('DOMContentLoaded', function() {
        console.log('Admin page loaded, URL:', window.location.href);
        
        // 監聽 Google 登錄狀態變化
        supabaseClient.auth.onAuthStateChange(function(event, session) {
            console.log('Auth state change:', event, session ? session.user.email : 'no user');
            if (event === 'SIGNED_IN' && session) {
                checkGoogleAuth();
            }
            if (event === 'SIGNED_OUT') {
                localStorage.removeItem('royalspl_admin');
                localStorage.removeItem('admin_email');
                document.getElementById('loginPage').style.display = 'block';
                document.getElementById('adminPage').style.display = 'none';
            }
        });
        
        // 檢查是否是 OAuth 回調（URL 中有 # 或 ?code=）
        var isOAuthCallback = window.location.hash.indexOf('access_token') >= 0 || 
                              window.location.search.indexOf('code=') >= 0 ||
                              window.location.hash.indexOf('refresh_token') >= 0;
        
        if (isOAuthCallback) {
            console.log('OAuth callback detected, waiting for session...');
            // 等待 Supabase 處理回調
            setTimeout(function() {
                checkGoogleAuth().then(function(loggedIn) {
                    if (!loggedIn) {
                        console.log('OAuth callback login failed');
                    }
                });
            }, 1000);
        } else {
            // 正常頁面加載，檢查登錄狀態
            checkGoogleAuth().then(function(loggedIn) {
                if (!loggedIn && localStorage.getItem('royalspl_admin') === 'true') {
                    // 帳號密碼登錄的情況
                    document.getElementById('loginPage').style.display = 'none';
                    document.getElementById('adminPage').style.display = 'block';
                    switchPage('analytics');
                    checkVisitorNotifications();
                }
            });
        }
    });
    </script>
        <script>
        const { useState, useEffect, useRef, useCallback, useMemo } = React;
        const html = htm.bind(React.createElement);

        const Lucide = {
            Bold: () => '𝐁', Italic: () => '𝐼', Underline: () => 'U̲',
            Palette: () => '', Highlighter: () => '', Link2: () => '',
            Quote: () => '❝', Code2: () => '</>', ListOrdered: () => '1.',
            List: () => '•', Outdent: () => '⏪', Indent: () => '⏩',
            GripVertical: () => '⋮⋮', Info: () => 'ℹ️', Type: () => 'T',
            Heading1: () => 'H1', Heading2: () => 'H2', Minus: () => '—',
            Image: () => '', Video: () => '', Table: () => '▦',
            MousePointerClick: () => '', LayoutDashboard: () => '',
            FileText: () => '', MessageSquare: () => '💬', FolderOpen: () => '',
            Tags: () => '', Users: () => '', TrendingUp: () => '',
            BarChart2: () => '', Download: () => '', Upload: () => '',
            Plus: () => '', Trash: () => '', Edit: () => ''
        };

        const blockTypes = {
            paragraph: { label: '段落', icon: 'Type', defaultContent: { text: '' } },
            heading1: { label: '標題1', icon: 'Heading1', defaultContent: { text: '' } },
            heading2: { label: '標題2', icon: 'Heading2', defaultContent: { text: '' } },
            quote: { label: '引用', icon: 'Quote', defaultContent: { text: '' } },
            list: { label: '列表', icon: 'List', defaultContent: { items: [] } },
            numberedList: { label: '編號列表', icon: 'ListOrdered', defaultContent: { items: [] } },
            divider: { label: '分隔線', icon: 'Minus', defaultContent: {} },
            image: { label: '圖片', icon: 'Image', defaultContent: { src: '', alt: '' } },
            video: { label: '視頻', icon: 'Video', defaultContent: { src: '' } },
            table: { label: '表格', icon: 'Table', defaultContent: { rows: 2, cols: 2 } },
            button: { label: '按鈕', icon: 'MousePointerClick', defaultContent: { text: '按鈕', url: '#' } },
            html: { label: '自定義 HTML', icon: 'Code2', defaultContent: { code: '' } }
        };

        const generateId = () => `block-${Date.now()}-${Math.random().toString(36).substr(2, 9)}`;
        const textToBlocks = (text) => {
            if (!text || text.trim() === '') return [];
            return [{ id: generateId(), type: 'paragraph', content: { text } }];
        };
        const renderIcon = (name) => {
            const fn = Lucide[name];
            return React.createElement('span', null, fn ? fn() : name);
        };

        function useBlockEditor(defaultBlocks, extraFields) {
            const [blocks, setBlocks] = useState(defaultBlocks);
            const [title, setTitle] = useState(extraFields?.title || '');
            const [coverImage, setCoverImage] = useState(extraFields?.coverImage || '');
            const [seoTitle, setSeoTitle] = useState(extraFields?.seoTitle || '');
            const [seoDesc, setSeoDesc] = useState(extraFields?.seoDesc || '');
            const [isPublished, setIsPublished] = useState(extraFields?.isPublished || false);
            const [showSlash, setShowSlash] = useState(false);
            const [slashPos, setSlashPos] = useState({ x: 0, y: 0 });
            const [slashTargetId, setSlashTargetId] = useState(null);
            const [colorPicker, setColorPicker] = useState(null);
            const [isDragging, setIsDragging] = useState(false);

            const insertBlock = (type, afterId) => {
                const newBlock = { id: generateId(), type, content: { ...blockTypes[type].defaultContent } };
                setBlocks(prev => {
                    const idx = prev.findIndex(b => b.id === afterId);
                    const arr = [...prev];
                    arr.splice(idx + 1, 0, newBlock);
                    return arr;
                });
                setShowSlash(false);
                setTimeout(() => {
                    const el = document.querySelector(`[data-block-id="${newBlock.id}"]`);
                    if (el) {
                        el.focus();
                        const range = document.createRange();
                        const sel = window.getSelection();
                        range.selectNodeContents(el);
                        range.collapse(false);
                        sel.removeAllRanges();
                        sel.addRange(range);
                    }
                }, 0);
            };

            const updateBlockContent = (id, newContent) => {
                setBlocks(prev => prev.map(b => b.id === id ? { ...b, content: { ...b.content, ...newContent } } : b));
            };
            const deleteBlock = (id) => setBlocks(prev => prev.filter(b => b.id !== id));
            const handleDragStart = (e, id) => { e.dataTransfer.setData('text/plain', id); setIsDragging(true); };
            const handleDragOver = (e) => { e.preventDefault(); };
            const handleDrop = (e, targetId) => {
                e.preventDefault();
                const sourceId = e.dataTransfer.getData('text/plain');
                if (sourceId === targetId) return;
                setBlocks(prev => {
                    const srcIdx = prev.findIndex(b => b.id === sourceId);
                    const tgtIdx = prev.findIndex(b => b.id === targetId);
                    const arr = [...prev];
                    const [moved] = arr.splice(srcIdx, 1);
                    arr.splice(tgtIdx, 0, moved);
                    return arr;
                });
                setIsDragging(false);
            };
            const uploadImage = async (file, blockId) => {
                const fd = new FormData();
                fd.append('file', file);
                const res = await fetch('/r2-upload', { method: 'POST', body: fd });
                const data = await res.json();
                if (data.url) updateBlockContent(blockId, { src: data.url });
            };

            return {
                blocks, setBlocks, title, setTitle, coverImage, setCoverImage,
                seoTitle, setSeoTitle, seoDesc, setSeoDesc, isPublished, setIsPublished,
                showSlash, setShowSlash, slashPos, setSlashPos, slashTargetId, setSlashTargetId,
                colorPicker, setColorPicker, isDragging, setIsDragging,
                insertBlock, updateBlockContent, deleteBlock,
                handleDragStart, handleDragOver, handleDrop, uploadImage
            };
        }

        function BlockRenderer({ block, updateBlockContent, deleteBlock, uploadImage }) {
            switch (block.type) {
                case 'paragraph':
                case 'heading1':
                case 'heading2':
                case 'quote': {
                    const style = block.type === 'heading1' ? { fontSize: '2em', fontWeight: 'bold' } :
                                  block.type === 'heading2' ? { fontSize: '1.5em', fontWeight: 'bold' } :
                                  block.type === 'quote' ? { borderLeft: '3px solid #ccc', paddingLeft: '10px', fontStyle: 'italic' } : {};
                    return React.createElement('div', {
                        contentEditable: true,
                        className: 'block-content-input',
                        style,
                        onInput: (e) => updateBlockContent(block.id, { text: e.currentTarget.innerHTML }),
                        dangerouslySetInnerHTML: { __html: block.content.text || '' }
                    });
                }
                case 'list':
                case 'numberedList': {
                    const tag = block.type === 'list' ? 'ul' : 'ol';
                    return React.createElement(tag, {
                        className: 'list-disc pl-5',
                        contentEditable: true,
                        onInput: (e) => updateBlockContent(block.id, { items: Array.from(e.currentTarget.children).map(li => li.textContent) })
                    }, (block.content.items || []).map((item, i) => React.createElement('li', { key: i }, item)));
                }
                case 'divider':
                    return React.createElement('hr', { className: 'my-4' });
                case 'image':
                    return React.createElement('div', null,
                        block.content.src
                            ? (block.content.link 
                                ? React.createElement('a', { href: block.content.link, target: '_blank', style: { display: 'block' } },
                                    React.createElement('img', { src: block.content.src, alt: block.content.alt || '', style: { maxWidth: '100%', borderRadius: '5px' } })
                                  )
                                : React.createElement('img', { src: block.content.src, alt: block.content.alt || '', style: { maxWidth: '100%', borderRadius: '5px' } })
                            )
                            : React.createElement('div', {
                                style: { border: '2px dashed #ddd', borderRadius: '5px', padding: '20px', textAlign: 'center', cursor: 'pointer' },
                                onClick: () => {
                                    const input = document.createElement('input');
                                    input.type = 'file';
                                    input.accept = 'image/*';
                                    input.onchange = (e) => uploadImage(e.target.files[0], block.id);
                                    input.click();
                                }
                            }, '點擊上傳圖片'),
                        React.createElement('div', { style: { display: 'flex', gap: '10px', marginTop: '5px' } },
                            React.createElement('input', {
                                type: 'text', value: block.content.alt || '', placeholder: '替代文字',
                                onChange: (e) => updateBlockContent(block.id, { alt: e.target.value }),
                                style: { flex: 1, border: '1px solid #ddd', borderRadius: '4px', padding: '4px' }
                            }),
                            React.createElement('input', {
                                type: 'text', value: block.content.link || '', placeholder: '圖片連結（點擊圖片跳轉的網址）',
                                onChange: (e) => updateBlockContent(block.id, { link: e.target.value }),
                                style: { flex: 2, border: '1px solid #ddd', borderRadius: '4px', padding: '4px' }
                            })
                        ),
                        React.createElement('button', { onClick: () => deleteBlock(block.id), style: { color: 'red', fontSize: '14px', marginTop: '5px' } }, '刪除')
                    );
                case 'video':
                    return React.createElement('div', null,
                        React.createElement('input', {
                            type: 'text', value: block.content.src || '', placeholder: '視頻網址',
                            onChange: (e) => updateBlockContent(block.id, { src: e.target.value }),
                            style: { width: '100%', border: '1px solid #ddd', borderRadius: '4px', padding: '6px' }
                        }),
                        block.content.src && React.createElement('iframe', { src: block.content.src, style: { width: '100%', height: '300px', marginTop: '5px' }, allowFullScreen: true })
                    );
                case 'table':
                    return React.createElement('div', null,
                        React.createElement('div', { style: { display: 'flex', gap: '10px', marginBottom: '5px' } },
                            React.createElement('label', null, '行'),
                            React.createElement('input', { type: 'number', min: 1, value: block.content.rows, onChange: (e) => updateBlockContent(block.id, { rows: parseInt(e.target.value) }), style: { width: '60px', border: '1px solid #ddd' } }),
                            React.createElement('label', null, '列'),
                            React.createElement('input', { type: 'number', min: 1, value: block.content.cols, onChange: (e) => updateBlockContent(block.id, { cols: parseInt(e.target.value) }), style: { width: '60px', border: '1px solid #ddd' } })
                        ),
                        React.createElement('table', { style: { width: '100%', borderCollapse: 'collapse' } },
                            React.createElement('tbody', null,
                                Array.from({ length: block.content.rows }, (_, r) =>
                                    React.createElement('tr', { key: r },
                                        Array.from({ length: block.content.cols }, (_, c) =>
                                            React.createElement('td', { key: c, style: { border: '1px solid #ddd', padding: '5px' } },
                                                React.createElement('div', { contentEditable: true, style: { minHeight: '2em', outline: 'none' } })
                                            )
                                        )
                                    )
                                )
                            )
                        )
                    );
                case 'button':
                    return React.createElement('div', { style: { display: 'flex', gap: '10px' } },
                        React.createElement('input', { type: 'text', value: block.content.text, onChange: (e) => updateBlockContent(block.id, { text: e.target.value }), placeholder: '按鈕文字', style: { border: '1px solid #ddd', borderRadius: '4px', padding: '6px' } }),
                        React.createElement('input', { type: 'text', value: block.content.url, onChange: (e) => updateBlockContent(block.id, { url: e.target.value }), placeholder: '連結', style: { border: '1px solid #ddd', borderRadius: '4px', padding: '6px' } }),
                        React.createElement('button', { onClick: () => deleteBlock(block.id), style: { color: 'red' } }, '刪除')
                    );
                case 'html':
                    return React.createElement('textarea', {
                        value: block.content.code,
                        onChange: (e) => updateBlockContent(block.id, { code: e.target.value }),
                        placeholder: '輸入 HTML 代碼', rows: 5,
                        style: { width: '100%', border: '1px solid #ddd', borderRadius: '4px', padding: '6px', fontFamily: 'monospace' }
                    });
                default:
                    return null;
            }
        }

            const loadPosts = async () => {
                setLoading(true);
                try {
                    const { data, error } = await window.supabaseClient.from('blog_posts').select('*').order('created_at', { ascending: false });
                    if (error) throw error;
                    setPosts(data || []);
                    setSelectedPostIds([]);
                } catch (e) {
                    console.error('載入文章失敗', e);
                    setPosts([]);
                } finally {
                    setLoading(false);
                }
            };

            useEffect(() => {
                if (activeSection === 'articles') loadPosts();
            }, [activeSection]);

            const handleSelectAll = (e) => {
                if (e.target.checked) { setSelectedPostIds(posts.map(p => p.id)); } else { setSelectedPostIds([]); }
            };
            const toggleSelect = (id) => {
                setSelectedPostIds(prev => prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id]);
            };
            const togglePublish = async (postId, currentStatus) => {
                await window.supabaseClient.from('blog_posts').update({ is_published: !currentStatus }).eq('id', postId);
                loadPosts();
            };

            const exportCSV = () => {
                const selectedPosts = posts.filter(p => selectedPostIds.includes(p.id));
                if (selectedPosts.length === 0) { alert('請先勾選要匯出的文章'); return; }
                const headers = ['id', 'title', 'content', 'image_url', 'seo_title', 'seo_description', 'is_published', 'created_at', 'category_id'];
                const csvRows = [headers.join(',')];
                selectedPosts.forEach(post => {
                    const row = [
                        post.id,
                        csvEscape(post.title || ''),
                        csvEscape(post.content || ''),
                        csvEscape(post.image_url || ''),
                        csvEscape(post.seo_title || ''),
                        csvEscape(post.seo_description || ''),
                        post.is_published ? 'true' : 'false',
                        csvEscape(post.created_at || ''),
                        post.category_id || ''
                    ];
                    csvRows.push(row.join(','));
                });
                const csvString = csvRows.join('\n');
                const blob = new Blob([csvString], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'blog_posts_export.csv';
                a.click();
                URL.revokeObjectURL(url);
            };

            const importCSV = (file) => {
                const reader = new FileReader();
                reader.onload = async (e) => {
                    const text = e.target.result;
                    const rows = parseCSV(text);
                    if (rows.length < 2) { alert('CSV 格式不正確'); return; }
                    const headers = rows[0].map(h => h.trim());
                    const requiredFields = ['title', 'content'];
                    if (!requiredFields.every(f => headers.includes(f))) { alert('CSV 缺少必要欄位：title, content'); return; }
                    let successCount = 0;
                    for (let i = 1; i < rows.length; i++) {
                        const row = rows[i];
                        if (row.length === 0) continue;
                        const obj = {};
                        headers.forEach((h, idx) => { obj[h] = row[idx] !== undefined ? row[idx] : ''; });
                        obj.is_published = obj.is_published === 'true' || obj.is_published === 'TRUE' || obj.is_published === '1';
                        const id = obj.id ? parseInt(obj.id) : null;
                        delete obj.id;
                        obj.category_id = obj.category_id ? parseInt(obj.category_id) : null;
                        try {
                            if (id) {
                                const { error } = await window.supabaseClient.from('blog_posts').update(obj).eq('id', id);
                                if (!error) successCount++;
                            } else {
                                const { error } = await window.supabaseClient.from('blog_posts').insert(obj);
                                if (!error) successCount++;
                            }
                        } catch (err) { console.error('匯入失敗', err); }
                    }
                    alert(`匯入完成，成功 ${successCount} 筆`);
                    loadPosts();
                };
                reader.readAsText(file);
            };

            const csvEscape = (str) => {
                if (str == null) return '';
                str = String(str);
                if (str.includes(',') || str.includes('"') || str.includes('\n')) {
                    str = '"' + str.replace(/"/g, '""') + '"';
                }
                return str;
            };
            const parseCSV = (text) => {
                const rows = [];
                let row = [];
                let field = '';
                let inQuotes = false;
                for (let i = 0; i < text.length; i++) {
                    const c = text[i];
                    if (inQuotes) {
                        if (c === '"') {
                            if (text[i+1] === '"') { field += '"'; i++; } else { inQuotes = false; }
                        } else { field += c; }
                    } else {
                        if (c === '"') { inQuotes = true; }
                        else if (c === ',') { row.push(field); field = ''; }
                        else if (c === '\n' || c === '\r') {
                            if (c === '\r' && text[i+1] === '\n') i++;
                            row.push(field);
                            rows.push(row);
                            row = [];
                            field = '';
                        } else { field += c; }
                    }
                }
                if (field || row.length) { row.push(field); rows.push(row); }
                return rows;

                { key: 'analytics', label: '分析', icon: 'BarChart2' },
                { key: 'members', label: '會員管理', icon: 'Users' }
            ];

            return React.createElement('div', { className: 'block-editor-wrapper' },
                React.createElement('div', { className: 'editor-sidebar' },
                    sidebarItems.map(item =>
                        React.createElement('div', {
                            key: item.key,
                            className: `editor-sidebar-item ${activeSection === item.key ? 'active' : ''}`,
                            onClick: () => setActiveSection(item.key)
                        },
                            renderIcon(item.icon),

                ),
                React.createElement('div', { className: 'editor-main' },
                    React.createElement('div', { className: 'editor-topbar' },
                        React.createElement('div', { className: 'editor-topbar-left' },
                            React.createElement('button', { className: 'btn btn-secondary btn-small', onClick: () => window.history.back() }, '上一步'),
                            React.createElement('h3', { style: { fontSize: '18px', fontWeight: '600' } },
                                activeSection === 'articles' ? '文章管理' :

    async function batchTranslate(type) {
    if (!confirm('確定要一鍵翻譯所有' + (type === 'products' ? '商品' : '部落格文章') + '為英文嗎？\n\n注意：只翻譯還沒有英文內容的項目，已有英文的不會覆蓋。\n翻譯需要一些時間，請勿關閉頁面。')) return;
    
    var btn = event.target;
    var originalText = btn.innerHTML;
    btn.innerHTML = '翻譯中...';
    btn.disabled = true;
    
    try {
        var resp = await fetch('/batch-translate', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ type: type })
        });
        var result = await resp.json();
        
        if (result.error) {
            showToast('翻譯失敗：' + result.error);
        } else {
            showToast('翻譯完成！成功 ' + result.translated + ' 項，失敗 ' + result.failed + ' 項');
        }
    } catch (e) {
        showToast('翻譯失敗：' + e.message);
    }
    
    btn.innerHTML = originalText;
    btn.disabled = false;
    
    // 重新載入列表
    if (type === 'products') loadProducts();
    else if (type === 'blog') loadBlogPosts();
}

function doAdminLogin() {
    var user = document.getElementById('loginUser').value.trim();
    var pass = document.getElementById('loginPass').value;
    if (user === 'admin' && pass === 'royalspl2024') {
        localStorage.setItem('royalspl_admin', 'true');
        document.getElementById('loginPage').style.display = 'none';
        document.getElementById('adminPage').style.display = 'block';
        if (typeof switchPage === 'function') switchPage('analytics');
        if (typeof checkVisitorNotifications === 'function') checkVisitorNotifications();
    } else {
        document.getElementById('loginError').style.display = 'block';
    }
}
