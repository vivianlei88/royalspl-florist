    async function loadChatSessions() {
        try {
            const { data, error } = await supabaseClient
                .from('chat_sessions')
                .select('*')
                .order('last_message_at', { ascending: false })
                .limit(50);
            if (error) throw error;
            
            const container = document.getElementById('chatSessionList');
            if (!container) return;
            
            if (!data || data.length === 0) {
                container.innerHTML = '<div style="padding:30px;text-align:center;color:#999;font-size:13px;">暫無會話</div>';
                return;
            }
            
            let html = '';
            for (var i = 0; i < data.length; i++) {
                var s = data[i];
                // 獲取該會話的未讀消息數
                const { data: unreadData } = await supabaseClient
                    .from('chat_messages')
                    .select('id')
                    .eq('session_id', s.session_id)
                    .eq('sender_type', 'visitor')
                    .eq('is_read', false);
                var unreadCount = (unreadData || []).length;
                
                html += '<div onclick="selectChatSession(\'' + s.session_id + '\')" style="padding:15px;border-bottom:1px solid #eee;cursor:pointer;background:' + (currentChatSession === s.session_id ? '#e8e8e8' : 'white') + ';" onmouseover="this.style.background=\'#f0f0f0\'" onmouseout="this.style.background=\'' + (currentChatSession === s.session_id ? '#e8e8e8' : 'white') + '\'">' +
                    '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;">' +
                    '<span style="font-size:14px;font-weight:600;">訪客 ' + (s.session_id.substring(5, 13) || '') + '</span>' +
                    (unreadCount > 0 ? '<span style="background:#ff4444;color:white;font-size:10px;padding:2px 6px;border-radius:10px;">' + unreadCount + '</span>' : '') +
                    '</div>' +
                    '<div style="font-size:11px;color:#999;margin-bottom:3px;">' + (s.current_page || '未知頁面').substring(0, 30) + '</div>' +
                    '<div style="font-size:11px;color:#bbb;">' + new Date(s.last_message_at).toLocaleString('zh-HK') + '</div></div>';
            }
            container.innerHTML = html;
        } catch (e) {
            console.error('加載會話列表失敗:', e);
        }
    }

    async function selectChatSession(sessionId) {
        currentChatSession = sessionId;
        loadChatSessions(); // 刷新高亮
        
        try {
            // 獲取會話信息
            const { data: sessionData } = await supabaseClient
                .from('chat_sessions')
                .select('*')
                .eq('session_id', sessionId)
                .single();
            
            var infoDiv = document.getElementById('chatSessionInfo');
            if (infoDiv && sessionData) {
                infoDiv.innerHTML = '<div style="font-size:14px;font-weight:600;">訪客 ' + sessionId.substring(5, 13) + '</div>' +
                    '<div style="font-size:12px;color:#666;margin-top:3px;"> 當前頁面: ' + (sessionData.current_page || '未知') + '</div>' +
                    '<div style="font-size:11px;color:#999;margin-top:2px;">IP: ' + (sessionData.visitor_ip || '未知') + (sessionData.visitor_region ? ' | ' + sessionData.visitor_region : '') + '</div>';
            }
            
            // 標記消息為已讀
            await supabaseClient
                .from('chat_messages')
                .update({ is_read: true })
                .eq('session_id', sessionId)
                .eq('sender_type', 'visitor');
            
            // 加載消息
            loadChatMessages(sessionId);
        } catch (e) {
            console.error('選擇會話失敗:', e);
        }
    }

    async function loadChatMessages(sessionId) {
        try {
            const { data, error } = await supabaseClient
                .from('chat_messages')
                .select('*')
                .eq('session_id', sessionId)
                .order('created_at', { ascending: true });
            if (error) throw error;
            
            const container = document.getElementById('chatMessages');
            if (!container) return;
            
            if (!data || data.length === 0) {
                container.innerHTML = '<div style="text-align:center;color:#999;padding:30px;">暫無消息</div>';
                return;
            }
            
            let html = '';
            data.forEach(function(m) {
                var isUser = m.sender_type === 'visitor';
                var isAdmin = m.sender_type === 'admin';
                var bgColor = isUser ? '#1A1A1A' : (isAdmin ? '#2563eb' : '#f0f0f0');
                var textColor = isUser || isAdmin ? 'white' : '#333';
                var align = isUser ? 'flex-end' : 'flex-start';
                var label = isUser ? '訪客' : (isAdmin ? '管理員' : 'AI客服');
                
                html += '<div style="display:flex;justify-content:' + align + ';margin-bottom:12px;">' +
                    '<div style="max-width:70%;">' +
                    '<div style="font-size:11px;color:#999;margin-bottom:3px;">' + label + ' · ' + new Date(m.created_at).toLocaleTimeString('zh-HK') + '</div>' +
                    '<div style="background:' + bgColor + ';color:' + textColor + ';padding:10px 15px;border-radius:12px;font-size:13px;line-height:1.5;word-break:break-word;">' + (m.content || '').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/\n/g, '<br>') + '</div></div></div>';
            });
            container.innerHTML = html;
            container.scrollTop = container.scrollHeight;
        } catch (e) {
            console.error('加載消息失敗:', e);
        }
    }

    async function sendAdminReply() {
        var input = document.getElementById('adminReplyInput');
        if (!input || !currentChatSession) return;
        var content = input.value.trim();

            await supabaseClient.from('chat_messages').insert({

            alert('發送失敗: ' + e.message);
        }
    }

    async function batchDeleteBlogs() {
        var ids = getSelectedBlogIds();
        if (ids.length === 0) { showToast('請先勾選文章'); return; }
        if (!confirm('確定刪除選中的 ' + ids.length + ' 篇文章？此操作不可恢復。')) return;
        try {
            await supabaseClient.from('blog_posts').delete().in('id', ids);
            showToast('已刪除 ' + ids.length + ' 篇文章');
            loadBlogList();
        } catch (e) {
            showToast('刪除失敗: ' + e.message);
        }
    }

    async function batchDownloadBlogs() {
        var ids = getSelectedBlogIds();
        if (ids.length === 0) { showToast('請先勾選文章'); return; }
        try {
            showToast('正在下載 ' + ids.length + ' 篇文章...');
            const { data, error } = await supabaseClient.from('blog_posts').select('*').in('id', ids);
            if (error) throw error;

            // 生成CSV
            var headers = ['title', 'slug', 'category', 'is_published', 'excerpt', 'content', 'title_en', 'content_en', 'created_at'];
            var csvContent = headers.join(',') + '\n';
            data.forEach(function(post) {
                var row = headers.map(function(h) {
                    var val = post[h] || '';
                    val = String(val).replace(/"/g, '""');
                    return '"' + val + '"';
                });
                csvContent += row.join(',') + '\n';
            });

            // 下载
            var blob = new Blob(['\ufeff' + csvContent], { type: 'text/csv;charset=utf-8;' });
            var link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'blog_posts_' + new Date().toISOString().split('T')[0] + '.csv';
            link.click();
            showToast('下載完成');
        } catch (e) {
            showToast('下載失敗: ' + e.message);
        }
    }

    async function translateBlogAll() {
        if (!confirm('確定將中文內容翻譯成英文？這會覆蓋現有英文內容。')) return;
        const title = document.getElementById('blogEditorTitle').value;
        const content = document.getElementById('blogEditorContent').value;
        if (!title && !content) { alert('請先輸入中文內容'); return; }
        alert('翻譯中...請稍候');
        try {
            if (title) {
                const resp = await fetch('/ai-write', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ type: 'translate', topic: title, language: 'en' }) });
                const result = await resp.json();
                if (result.success) {
                    if (window.blogEditLang === 'en') document.getElementById('blogEditorTitle').value = result.content.trim();
                }
            }
            if (content) {
                const resp2 = await fetch('/ai-write', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ type: 'translate', topic: content, language: 'en' }) });
                const result2 = await resp2.json();

    async function importBlogCSV() {
        const fileInput = document.getElementById('blogCsvFile');
        const file = blogCsvFileGlobal || (fileInput && fileInput.files[0]);
        if (!file) { alert('請選擇 CSV 檔案'); return; }
        const progress = document.getElementById('blogImportProgress');
        progress.style.display = 'block';
        progress.textContent = '讀取檔案中...';
        try {
            const text = await file.text();
            // 使用更健壮的CSV解析器，支持引号内的逗号和换行
            const rows = parseCSV(text);
            if (rows.length < 2) { alert('CSV 檔案沒有數據'); return; }
            const headers = rows[0].map(function(h) { return h.trim(); });
            let imported = 0, skipped = 0, errors = 0;
            for (let i = 1; i < rows.length; i++) {
                try {
                    const values = rows[i];
                    const row = {};
                    headers.forEach(function(h, idx) { row[h] = (values[idx] || '').trim(); });
                    const title = row.title || row.Title || '';
                    if (!title) { skipped++; continue; }
                    const slug = row.slug || title;
                    // 检查是否已存在
                    const exists = await supabaseClient.from('blog_posts').select('id').eq('slug', slug).limit(1);
                    if (exists.data && exists.data.length > 0) { skipped++; continue; }
                    // 处理发布日期
                    let createdAt = null;
                    if (row.firstPublishedDate) {
                        createdAt = row.firstPublishedDate;
                    } else if (row.lastPublishedDate) {
                        createdAt = row.lastPublishedDate;
                    }
                    // 插入文章
                    const insertData = {
                        title: title,
                        content: row.contentText || row.content || '',
                        excerpt: row.excerpt || '',
                        slug: slug,
                        category: '匯入文章',
                        is_published: true
                    };
                    if (createdAt) {
                        insertData.created_at = createdAt;
                    }

    // 健壮的CSV解析器，支持引号内的逗号和换行
    function parseCSV(text) {
        const rows = [];
        let currentRow = [];
        let currentField = '';
        let inQuotes = false;
        for (let i = 0; i < text.length; i++) {
            const char = text[i];
            if (inQuotes) {
                if (char === '"') {
                    if (text[i + 1] === '"') {
                        currentField += '"';
                        i++;
                    } else {
                        inQuotes = false;
                    }
                } else {
                    currentField += char;
                }
            } else {
                if (char === '"') {
                    inQuotes = true;
                } else if (char === ',') {
                    currentRow.push(currentField);
                    currentField = '';
                } else if (char === '\n') {
                    currentRow.push(currentField);
                    rows.push(currentRow);
                    currentRow = [];
                    currentField = '';
                } else if (char === '\r') {
                    // 忽略回车符
                } else {
                    currentField += char;
                }
            }
        }
        // 处理最后一行
        if (currentField !== '' || currentRow.length > 0) {
            currentRow.push(currentField);
            rows.push(currentRow);
        }
        return rows.filter(function(row) { return row.some(function(f) { return f.trim() !== ''; }); });
    }

    async function sendEDM() {
        var subject = document.getElementById('edmSubject').value.trim();

        var recipients = document.getElementById('edmRecipients').value;
        var btnText = document.getElementById('edmButtonText').value.trim();
        var btnUrl = document.getElementById('edmButtonUrl').value.trim();
        
        if (!subject) { alert('請輸入郵件主題'); return; }
        if (!content) { alert('請輸入郵件內容'); return; }
        
        var emails = [];
        try {
            if (recipients === 'manual') {
                var manual = document.getElementById('edmManualEmails').value.trim();
                if (!manual) { alert('請輸入郵箱地址'); return; }
                emails = manual.split(/[,\n]/).map(function(e) { return e.trim(); }).filter(function(e) { return e && e.includes('@'); });
            } else if (recipients === 'customers') {
                var r = await supabaseClient.from('orders').select('customer_email').not('customer_email', 'is', null);
                var seen = {};
                (r.data || []).forEach(function(o) { if (o.customer_email && !seen[o.customer_email]) { seen[o.customer_email] = true; emails.push(o.customer_email); } });
            } else {
                var r2 = await supabaseClient.from('profiles').select('email').not('email', 'is', null);
                emails = (r2.data || []).map(function(p) { return p.email; }).filter(function(e) { return e; });
            }
            
            if (emails.length === 0) { alert('沒有找到收件人'); return; }
            if (!confirm('確定發送郵件給 ' + emails.length + ' 位收件人？\n\n' + emails.slice(0,5).join('\n') + (emails.length > 5 ? '\n...' : ''))) return;
            
            // 獲取店鋪資料
            var shop = {};
            try {
                var sr = await supabaseClient.from('shop_settings').select('*').limit(1);
                if (sr.data && sr.data.length > 0) shop = sr.data[0];
            } catch(e) {}
            
            // 構建完整 HTML 郵件
            var buttonHtml = '';
            if (btnText && btnUrl) {
                buttonHtml = '<div style="text-align:center;margin:25px 0;"><a href="' + btnUrl + '" style="display:inline-block;padding:14px 40px;background:#1A1A1A;color:white;text-decoration:none;border-radius:6px;font-size:16px;font-weight:600;">' + btnText + '</a></div>';
            }
            
            var emailHtml = '<div style="max-width:600px;margin:0 auto;font-family:Arial,sans-serif;">' +
                // 頁頭
                '<div style="background:#1A1A1A;color:white;padding:30px 20px;text-align:center;">' +
                (shop.shop_logo ? '<img src="' + shop.shop_logo + '" style="max-height:60px;margin-bottom:15px;">' : '') +
                '<div style="font-size:24px;font-weight:600;margin:0;">' + (shop.shop_name || 'RoyalSpl Florist') + '</div>' +
                '<div style="font-size:13px;opacity:0.8;margin-top:8px;">' + (shop.shop_phone || '') + (shop.shop_email ? ' | ' + shop.shop_email : '') + '</div>' +
                '</div>' +
                // 內容
                '<div style="padding:30px 25px;background:white;">' +
                '<h1 style="font-size:22px;color:#1A1A1A;margin:0 0 20px 0;line-height:1.4;">' + subject + '</h1>' +
                '<div style="font-size:15px;line-height:1.8;color:#333;white-space:pre-wrap;">' + content.replace(/\n/g, '<br>') + '</div>' +
                buttonHtml +
                '</div>' +
                // 頁腳
                '<div style="background:#f5f5f5;padding:20px;text-align:center;font-size:12px;color:#999;line-height:1.6;">' +
                (shop.shop_address ? '<div>' + shop.shop_address + '</div>' : '') +
                '<div style="margin-top:8px;">© 2026 ' + (shop.shop_name || 'RoyalSpl Florist') + '. All rights reserved.</div>' +
                '<div style="margin-top:5px;"><a href="https://www.royalspl.shop" style="color:#666;">www.royalspl.shop</a></div>' +
                '</div></div>';
            
            // 顯示發送中
            var btn = document.querySelector('button[onclick="sendEDM()"]');
            if (btn) { btn.textContent = '發送中...'; btn.disabled = true; }
            
            // 調用發送接口
            var resp = await fetch('/send-edm', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    recipients: emails,
                    subject: subject,
                    html: emailHtml
                })
            });
            
            var result = await resp.json();
            if (result.success) {
                alert('發送完成！\n總共：' + result.total + ' 封\n成功：' + result.successCount + ' 封\n失敗：' + result.failCount + ' 封');
            } else {
                alert('發送失敗: ' + (result.error || '未知錯誤'));
            }
            
            if (btn) { btn.textContent = '發送郵件'; btn.disabled = false; }
            
        } catch(e) {
            alert('發送失敗: ' + e.message);
            var btn = document.querySelector('button[onclick="sendEDM()"]');
            if (btn) { btn.textContent = '發送郵件'; btn.disabled = false; }
        }
    }

    async function generateAndSubmitSitemap() {
        const resultDiv = document.getElementById('sitemapResult');
        resultDiv.innerHTML = '<div style="color:#666;">正在生成 sitemap，請稍候...</div>';
        try {
            // 1. 獲取 GitHub Token
            const { data: tokenData } = await supabaseClient.from('site_settings').select('setting_value').eq('setting_key', 'github_token').single();
            if (!tokenData) throw new Error('未找到 GitHub Token');
            const githubToken = tokenData.setting_value;
            const repoOwner = 'vivianlei88';
            const repoName = 'royalspl-florist';

            // 2. 讀取所有商品
            const { data: products } = await supabaseClient.from('products').select('id, updated_at').eq('status', 'active');
            // 3. 讀取所有分類
            const { data: categories } = await supabaseClient.from('categories').select('id, updated_at');
            // 4. 讀取所有已發布部落格
            const { data: posts } = await supabaseClient.from('blog_posts').select('id, updated_at').eq('status', 'published');

            // 5. 生成 sitemap XML
            let xml = '<?xml version="1.0" encoding="UTF-8"?>\n';
            xml += '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n';
            
            const baseUrl = 'https://www.royalspl.shop/';
            const staticPages = ['', 'products.html', 'categories.html', 'blog.html', 'contact.html', 'faq.html', 'privacy.html'];
            const today = new Date().toISOString().split('T')[0];
            
            staticPages.forEach(page => {
                xml += '  <url>\n';
                xml += '    <loc>' + baseUrl + page + '</loc>\n';
                xml += '    <lastmod>' + today + '</lastmod>\n';
                xml += '    <changefreq>weekly</changefreq>\n';
                xml += '    <priority>' + (page === '' ? '1.0' : '0.8') + '</priority>\n';
                xml += '  </url>\n';
            });
            
            (products || []).forEach(p => {
                const lastmod = p.updated_at ? p.updated_at.split('T')[0] : today;
                xml += '  <url>\n';
                xml += '    <loc>' + baseUrl + 'product-detail.html?id=' + p.id + '</loc>\n';
                xml += '    <lastmod>' + lastmod + '</lastmod>\n';
                xml += '    <changefreq>weekly</changefreq>\n';
                xml += '    <priority>0.7</priority>\n';
                xml += '  </url>\n';
            });
            
            (categories || []).forEach(c => {
                const lastmod = c.updated_at ? c.updated_at.split('T')[0] : today;
                xml += '  <url>\n';
                xml += '    <loc>' + baseUrl + 'categories.html?id=' + c.id + '</loc>\n';
                xml += '    <lastmod>' + lastmod + '</lastmod>\n';
                xml += '    <changefreq>weekly</changefreq>\n';
                xml += '    <priority>0.6</priority>\n';
                xml += '  </url>\n';
            });
            
            (posts || []).forEach(p => {
                const lastmod = p.updated_at ? p.updated_at.split('T')[0] : today;
                xml += '  <url>\n';
                xml += '    <loc>' + baseUrl + 'blog-detail.html?id=' + p.id + '</loc>\n';
                xml += '    <lastmod>' + lastmod + '</lastmod>\n';
                xml += '    <changefreq>monthly</changefreq>\n';
                xml += '    <priority>0.5</priority>\n';
                xml += '  </url>\n';
            });
            
            xml += '</urlset>';

            const totalUrls = staticPages.length + (products || []).length + (categories || []).length + (posts || []).length;

            // 6. 獲取當前 sitemap.xml 的 SHA
            const fileResp = await fetch('https://api.github.com/repos/' + repoOwner + '/' + repoName + '/contents/sitemap.xml', {
                headers: { 'Authorization': 'Bearer ' + githubToken, 'Accept': 'application/vnd.github.v3+json' }
            });
            const fileData = await fileResp.json();
            const sha = fileData.sha;

            // 7. 提交到 GitHub
            const commitResp = await fetch('https://api.github.com/repos/' + repoOwner + '/' + repoName + '/contents/sitemap.xml', {
                method: 'PUT',
                headers: { 'Authorization': 'Bearer ' + githubToken, 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    message: 'feat: 自動更新 sitemap.xml (' + totalUrls + ' 個URL)',
                    content: btoa(unescape(encodeURIComponent(xml))),
                    sha: sha
                })
            });

            if (commitResp.ok) {
                // 自動提交到 Google 和 Bing
                const sitemapUrl = 'https://www.royalspl.shop/sitemap.xml';
                let pingResults = [];
                try {
                    await fetch('https://www.google.com/ping?sitemap=' + encodeURIComponent(sitemapUrl), { mode: 'no-cors' });
                    pingResults.push('Google ✅');
                } catch (e) { pingResults.push('Google ❌'); }
                try {
                    await fetch('https://www.bing.com/ping?sitemap=' + encodeURIComponent(sitemapUrl), { mode: 'no-cors' });
                    pingResults.push('Bing ✅');
                } catch (e) { pingResults.push('Bing ❌'); }
                
                resultDiv.innerHTML = '<div style="color:#52C41A;font-weight:600;">✅ Sitemap 生成並提交成功！</div>' +
                    '<div style="color:#666;margin-top:10px;">共 ' + totalUrls + ' 個 URL（靜態頁面 ' + staticPages.length + ' / 商品 ' + (products || []).length + ' / 分類 ' + (categories || []).length + ' / 部落格 ' + (posts || []).length + '）</div>' +
                    '<div style="color:#666;margin-top:8px;">已通知搜索引擎：' + pingResults.join('、') + '</div>' +
                    '<div style="color:#999;margin-top:5px;font-size:12px;">Cloudflare Pages 正在自動部署，大約1分鐘後生效</div>';
            } else {
                const err = await commitResp.json();
                throw new Error('GitHub 提交失敗: ' + (err.message || commitResp.status));
            }
        } catch (e) {
            resultDiv.innerHTML = '<div style="color:#EA6668;font-weight:600;">❌ 生成失敗</div>' +
                '<div style="color:#666;margin-top:10px;">' + e.message + '</div>';
        }
    }

    async function loadProductSEOCheck() {
        try {
            const { data: products, error } = await supabaseClient.from('products').select('id, name_zh, name_en, description, is_active').order('id');
            if (error) throw error;
            const container = document.getElementById('productSEOItems');
            if (!products || products.length === 0) {
                container.innerHTML = '<div style="padding:30px;text-align:center;color:#999;">暫無商品</div>';
                return;
            }
            const keywords = ['香港', '配送', '花束', '生日', '花藝', '鮮花'];
            let html = '';
            let good = 0, warning = 0, bad = 0;
            products.forEach(p => {
                const desc = (p.description || '').trim();
                const descLen = desc.length;
                const matchedKw = keywords.filter(kw => desc.includes(kw));
                let status, statusColor;
                if (descLen >= 100 && matchedKw.length >= 2) { status = '良好'; statusColor = '#52C41A'; good++; }
                else if (descLen >= 50) { status = '需改進'; statusColor = '#FAAD14'; warning++; }
                else { status = '需優化'; statusColor = '#EA6668'; bad++; }
                html += '<div style="display:grid;grid-template-columns:1.3fr 1fr 1.2fr 0.9fr 100px;gap:10px;padding:12px 20px;border-bottom:1px solid #eee;align-items:center;">' +
                    '<div><div style="font-size:14px;font-weight:600;">' + (p.name_zh || p.name_en || '未命名') + '</div>' +
                    '<div style="font-size:12px;color:#999;">ID: ' + p.id + '</div></div>' +
                    '<div style="font-size:13px;">' + descLen + ' 字</div>' +
                    '<div style="font-size:12px;">' + (matchedKw.length > 0 ? matchedKw.join(', ') : '<span style="color:#ccc;">無</span>') + '</div>' +
                    '<div style="color:' + statusColor + ';font-size:13px;font-weight:600;">' + status + '</div>' +
                    '<div><button class="btn btn-small btn-secondary" onclick="switchPage(\'products\')">編輯</button></div></div>';
            });
            html = '<div style="padding:15px 20px;background:#f9f9f9;font-size:13px;display:flex;gap:20px;border-bottom:1px solid #eee;">' +
                '<span>共 ' + products.length + ' 個商品</span>' +
                '<span style="color:#52C41A;">✅ 良好: ' + good + '</span>' +
                '<span style="color:#FAAD14;">⚠️ 需改進: ' + warning + '</span>' +
                '<span style="color:#EA6668;">❌ 需優化: ' + bad + '</span></div>' + html;
            container.innerHTML = html;

    async function loadKeywordRankings() {
        try {
            const { data, error } = await supabaseClient.from('keyword_rankings')
                .select('*').order('check_date', { ascending: false }).limit(14 * 2);
            if (error) throw error;
            const container = document.getElementById('keywordRankingItems');
            if (!data || data.length === 0) {
                container.innerHTML = '<div style="padding:30px;text-align:center;color:#999;">暫無數據，點擊「更新排名數據」開始查詢</div>';
                return;
            }
            // 獲取每個關鍵詞最新的排名
            const latest = {};
            const previous = {};
            data.forEach(row => {
                if (!latest[row.keyword]) {
                    latest[row.keyword] = row;
                } else if (!previous[row.keyword]) {
                    previous[row.keyword] = row;
                }
            });
            let html = '';
            seoKeywords.forEach(kw => {
                const row = latest[kw];
                const prev = previous[kw];
                if (!row) {
                    html += '<div style="display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr 1fr;gap:10px;padding:12px 20px;border-bottom:1px solid #eee;">' +
                        '<div style="font-size:14px;">' + kw + '</div>' +
                        '<div colspan="5" style="color:#ccc;font-size:13px;">未查詢</div></div>';
                    return;
                }
                let trend = '-';
                let trendColor = '#999';
                if (prev && prev.position && row.position) {
                    const diff = prev.position - row.position;
                    if (diff > 0) { trend = '↑ ' + diff; trendColor = '#52C41A'; }
                    else if (diff < 0) { trend = '↓ ' + Math.abs(diff); trendColor = '#EA6668'; }
                    else { trend = '→ 0'; trendColor = '#999'; }
                }
                const posColor = row.position <= 10 ? '#52C41A' : row.position <= 30 ? '#FAAD14' : '#EA6668';
                html += '<div style="display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr 1fr 0.9fr;gap:10px;padding:12px 20px;border-bottom:1px solid #eee;align-items:center;">' +
                    '<div style="font-size:14px;">' + kw + '</div>' +
                    '<div style="font-size:14px;font-weight:600;color:' + posColor + ';">' + (row.position ? row.position.toFixed(0) : '-') + '</div>' +
                    '<div style="font-size:13px;">' + (row.impressions || 0) + '</div>' +
                    '<div style="font-size:13px;">' + (row.clicks || 0) + '</div>' +
                    '<div style="font-size:13px;">' + (row.ctr ? (row.ctr * 100).toFixed(2) + '%' : '-') + '</div>' +
                    '<div style="font-size:13px;color:' + trendColor + ';font-weight:600;">' + trend + '</div></div>';
            });
            container.innerHTML = html;
        } catch (e) {
            document.getElementById('keywordRankingItems').innerHTML = '<div style="padding:30px;text-align:center;color:#999;">加載失敗: ' + e.message + '</div>';
        }
    }

    async function getGCPAccessToken() {
        try {
            const { data } = await supabaseClient.from('site_settings').select('setting_value').eq('setting_key', 'gcp_service_account').single();
            if (!data) throw new Error('未找到服務帳號密鑰');
            const sa = JSON.parse(data.setting_value);
            const header = { alg: 'RS256', typ: 'JWT' };
            const now = Math.floor(Date.now() / 1000);
            const payload = {
                iss: sa.client_email,
                scope: 'https://www.googleapis.com/auth/webmasters.readonly',
                aud: sa.token_uri,
                exp: now + 3600,
                iat: now
            };
            const sHeader = KJUR.jws.JWS.sign('RS256', JSON.stringify(header), JSON.stringify(payload), sa.private_key);
            const tokenResp = await fetch(sa.token_uri, {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: 'grant_type=urn:ietf:params:oauth:grant-type:jwt-bearer&assertion=' + sHeader
            });
            const tokenData = await tokenResp.json();
            return tokenData.access_token;
        } catch (e) {
            console.error('獲取Google API token失敗:', e);
            throw e;
        }
    }

    async function updateKeywordRankings() {
        try {
            alert('開始更新排名數據，請稍候...');
            const accessToken = await getGCPAccessToken();
            const siteUrl = 'https://www.royalspl.shop/';
            const today = new Date().toISOString().split('T')[0];
            const startDate = new Date(Date.now() - 3 * 24 * 60 * 60 * 1000).toISOString().split('T')[0];
            
            for (let i = 0; i < seoKeywords.length; i++) {
                const kw = seoKeywords[i];
                try {
                    const resp = await fetch('https://www.googleapis.com/webmasters/v3/sites/' + encodeURIComponent(siteUrl) + '/searchAnalytics/query', {
                        method: 'POST',
                        headers: { 'Authorization': 'Bearer ' + accessToken, 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            startDate: startDate,
                            endDate: today,
                            dimensions: ['query'],
                            dimensionFilterGroups: [{
                                filters: [{ dimension: 'query', operator: 'equals', expression: kw }]
                            }],
                            rowLimit: 1
                        })
                    });
                    const data = await resp.json();
                    if (data.rows && data.rows.length > 0) {
                        const row = data.rows[0];
                        await supabaseClient.from('keyword_rankings').upsert({
                            keyword: kw,
                            position: Math.round(row.position),
                            impressions: row.impressions,
                            clicks: row.clicks,
                            ctr: row.ctr,
                            check_date: today
                        }, { onConflict: 'keyword,check_date' });
                    } else {
                        await supabaseClient.from('keyword_rankings').upsert({
                            keyword: kw,
                            position: null,
                            impressions: 0,
                            clicks: 0,
                            ctr: 0,
                            check_date: today
                        }, { onConflict: 'keyword,check_date' });
                    }
                } catch (e) {
                    console.error('查詢關鍵詞 ' + kw + ' 失敗:', e);
                }
            }
            alert('排名數據更新完成！');
            await loadKeywordRankings();
        } catch (e) {
            alert('更新失敗: ' + e.message);
        }
    }

    async function loadSEOData() {
        try {
            const { data: overrides, error } = await supabaseClient.from('seo_overrides').select('*');
            if (error) throw error;
            const overrideMap = {};
            (overrides || []).forEach(o => { overrideMap[o.page_url] = o; });
            let totalScore = 0;
            let checked = 0;
            let optimized = 0;
            let html = '';
            seoPages.forEach(page => {
                const override = overrideMap[page.url];
                const title = override?.title || '';
                const desc = override?.description || '';
                let score = 0;
                if (title.length > 0 && title.length <= 60) score += 40;
                else if (title.length > 0) score += 20;
                if (desc.length >= 50 && desc.length <= 160) score += 40;
                else if (desc.length > 0) score += 20;
                if (page.type === 'page') score += 20;
                totalScore += score;
                checked++;
                if (title && desc.length >= 50) optimized++;
                const statusColor = score >= 80 ? '#52C41A' : score >= 50 ? '#FAAD14' : '#EA6668';
                const statusText = score >= 80 ? '良好' : score >= 50 ? '需改進' : '缺失';
                html += '<div style="display:grid;grid-template-columns:1.2fr 1.2fr 1.2fr 0.9fr 100px;gap:10px;padding:15px 20px;border-bottom:1px solid #eee;align-items:center;">';
                html += '<div><div style="font-weight:600;font-size:14px;">' + page.name + '</div><div style="font-size:12px;color:#999;">' + page.url + '</div></div>';
                html += '<div style="font-size:13px;color:#333;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="' + title.replace(/"/g, '&quot;') + '">' + (title || '<span style="color:#ccc;">未設置</span>') + '</div>';
                html += '<div style="font-size:13px;color:#333;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="' + desc.replace(/"/g, '&quot;') + '">' + (desc || '<span style="color:#ccc;">未設置</span>') + '</div>';
                html += '<div style="color:' + statusColor + ';font-size:13px;font-weight:600;">' + statusText + '</div>';
                html += '<div><button class="btn btn-small btn-secondary" onclick="editSEO(\'' + page.url + '\',\'' + page.name + '\')">編輯</button></div>';
                html += '</div>';
            });
            document.getElementById('seoPageItems').innerHTML = html;
            const avgScore = Math.round(totalScore / checked);
            document.getElementById('seoScore').textContent = avgScore + '/100';
            document.getElementById('seoScore').style.color = avgScore >= 80 ? '#52C41A' : avgScore >= 50 ? '#FAAD14' : '#EA6668';
            document.getElementById('seoSummary').innerHTML = '共 ' + checked + ' 個頁面<br>已優化: ' + optimized + ' 個<br>需改進: ' + (checked - optimized) + ' 個';
        } catch (e) {
            document.getElementById('seoPageItems').innerHTML = '<div style="padding:30px;text-align:center;color:#999;">加載失敗，請確保已在 Supabase 創建 seo_overrides 表</div>';
        }
    }

    // ==================== 通知聲音 ====================
    function playNotificationSound() {
        try {
            var audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            // 叮咚聲 - 兩次提示音
            var playDing = function(freq, startTime, duration) {
                var oscillator = audioCtx.createOscillator();
                var gainNode = audioCtx.createGain();
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                oscillator.frequency.value = freq;
                oscillator.type = 'sine';
                gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime + startTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + startTime + duration);
                oscillator.start(audioCtx.currentTime + startTime);
                oscillator.stop(audioCtx.currentTime + startTime + duration);
            };
            playDing(880, 0, 0.25); // 叮
            playDing(1100, 0.25, 0.35); // 咚
        } catch (e) {}
    }

            for (var i = 0; i < orders.length; i++) {
                var o = orders[i];
                var orderTime = o.updated_at || o.created_at;
                if (orderTime > lastOrderCheckTime && notifiedOrderIds.indexOf(o.id) === -1) {
                    newNotifications.push(o);
                    notifiedOrderIds.push(o.id);
                }
            }

            if (newNotifications.length > 0) {
                updateNotificationBadge();
                var latest = newNotifications[0];
                var statusText = getOrderStatusText(latest.status);
                // 瀏覽器通知
                if (Notification.permission === 'granted') {
                    new Notification('訂單提醒', {
                        body: '訂單 ' + latest.order_code + ' 狀態：' + statusText + '，金額：HK$' + latest.total_amount,
                        icon: 'https://www.royalspl.shop/favicon.ico'
                    });
                }
                // 手機端頁面內彈出提示
                if (window.innerWidth <= 768) {
                    showMobileAlert('新訂單！', '訂單號：' + latest.order_code + '<br>狀態：' + statusText + '<br>金額：HK$' + latest.total_amount, 'order');
                }
                playNotificationSound();
                showToast(' 新訂單：' + latest.order_code + ' - ' + getOrderStatusText(latest.status));
            }

            lastOrderCheckTime = new Date().toISOString();
        } catch (e) {
            console.error('檢查訂單失敗:', e);
        }
    }

    function getOrderStatusText(status) {

            'shipped': '已出貨',

    async function loadNotificationList() {
        var list = document.getElementById('notificationList');
        if (!list) return;

        try {
            var thirtyMinutesAgo = new Date(Date.now() - 30 * 60 * 1000).toISOString();
            var visitorResult = await supabaseClient
                .from('visitor_logs')
                .select('*')
                .gte('created_at', thirtyMinutesAgo)
                .order('created_at', { ascending: false })
                .limit(10);

            var orderResult = await supabaseClient
                .from('orders')
                .select('*')
                .gte('created_at', thirtyMinutesAgo)
                .order('created_at', { ascending: false })
                .limit(10);

            var visitors = visitorResult.data || [];
            var orders = orderResult.data || [];

            var allNotifications = [];
            visitors.forEach(function(v) {
                allNotifications.push({ type: 'visitor', time: v.created_at, data: v });
            });
            orders.forEach(function(o) {
                allNotifications.push({ type: 'order', time: o.created_at, data: o });
            });
            allNotifications.sort(function(a, b) { return new Date(b.time) - new Date(a.time); });

            if (allNotifications.length === 0) {
                list.innerHTML = '<div style="padding:30px;text-align:center;color:#999;">暫無通知</div>';
                return;
            }

            var html = '';
            allNotifications.slice(0, 20).forEach(function(n) {
                if (n.type === 'visitor') {
                    var v = n.data;
                    var location = [v.region, v.city, v.country].filter(Boolean).join(' ') || '未知地區';
                    var page = v.page_title || v.page_url || '未知頁面';
                    var visitorType = v.is_new_visitor ? ' 新訪客' : ' 回訪客';
                    html += '<div style="padding:12px;border-bottom:1px solid #f0f0f0;cursor:pointer;" onclick="switchPage(\'visitors\');document.getElementById(\'notificationPanel\').remove();">' +
                        '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;">' +
                        '<span style="font-weight:600;font-size:13px;">' + visitorType + '</span>' +

                    html += '<div style="padding:12px;border-bottom:1px solid #f0f0f0;cursor:pointer;" onclick="openOrderDetail(' + o.id + ');document.getElementById(\'notificationPanel\').remove();">' +
                        '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;">' +
                        '<span style="font-weight:600;font-size:13px;"> 訂單 ' + o.order_code + '</span>' +
                        '<span style="font-size:11px;color:#999;">' + formatNotificationTime(n.time) + '</span></div>' +
                        '<div style="font-size:12px;color:#666;">狀態：' + getOrderStatusText(o.status) + '</div>' +
                        '<div style="font-size:12px;color:#666;">金額：HK$' + o.total_amount + ' | 收花人：' + (o.recipient_name || '') + '</div></div>';
                }
            });
            list.innerHTML = html;
        } catch (e) {
            list.innerHTML = '<div style="padding:20px;text-align:center;color:#999;">加載失敗</div>';
        }

    function formatNotificationTime(isoString) {
        var d = new Date(isoString);
        var now = new Date();
        var diff = (now - d) / 1000;
        if (diff < 60) return '剛剛';
        if (diff < 3600) return Math.floor(diff / 60) + '分鐘前';
        if (diff < 86400) return Math.floor(diff / 3600) + '小時前';
        return d.toLocaleDateString();
    }

            var orderRes = await supabaseClient.from('orders').select('id,total_amount,status').gte('created_at', todayStr);

            var todaySalesAmount = 0;
            if (orderRes.data) {
                orderRes.data.forEach(function(o) {
                    todayOrderCount++;
                    var status = o.status || '';

            console.error('加载今日数据失败:', e);
        }
    }

    async function loadLocalStats() {
        try {
            var productCount = await supabaseClient.from('products').select('id', { count: 'exact', head: true });
            var ordersResult = await supabaseClient.from('orders').select('id,total_amount,status');
            var viewCount = await supabaseClient.from('page_views').select('id', { count: 'exact', head: true });
            
            var totalSales = 0, paidCount = 0, pendingFps = 0, unpaid = 0, paid = 0, completed = 0;
            if (ordersResult.data) {
                for (var i = 0; i < ordersResult.data.length; i++) {
                    var o = ordersResult.data[i];
                    totalSales += parseFloat(o.total_amount) || 0;
                    var s = o.status || '';
                    if (s === 'paid' || s === 'completed') paidCount++;
                    if (s === 'pending_payment') pendingFps++;
                    if (s === 'unpaid') unpaid++;
                    if (s === 'paid') paid++;
                    if (s === 'completed') completed++;
                }
            }
            var avgOrder = paidCount > 0 ? (totalSales / paidCount).toFixed(0) : 0;
            
            document.getElementById('localProducts').textContent = productCount.count || 0;
            document.getElementById('localOrders').textContent = ordersResult.data ? ordersResult.data.length : 0;
            document.getElementById('localPaidOrders').textContent = paidCount;
            document.getElementById('localSales').textContent = 'HK$' + totalSales.toFixed(0);
            document.getElementById('localAvgOrder').textContent = 'HK$' + avgOrder;
            document.getElementById('localViews').textContent = viewCount.count || 0;
            document.getElementById('statPendingFps').textContent = pendingFps;
            document.getElementById('statUnpaid').textContent = unpaid;
            document.getElementById('statPaid').textContent = paid;
            document.getElementById('statCompleted').textContent = completed;
        } catch (e) { console.error('loadLocalStats error:', e); }
    }

    function initUploadArea() { var ua = document.getElementById('uploadArea'); var fi = document.getElementById('fileInput'); if (ua && fi) { ua.onclick = function() { fi.click(); }; fi.onchange = function() { handleUploadFiles(this.files); }; ua.addEventListener('dragover', function(e) { e.preventDefault(); }); ua.addEventListener('drop', function(e) { e.preventDefault(); handleUploadFiles(e.dataTransfer.files); }); } }
    async function handleUploadFiles(files) { for (var i = 0; i < files.length; i++) { var fd = new FormData(); fd.append('file', files[i]); try { var res = await fetch('/r2-upload', { method: 'POST', body: fd }); var data = await res.json(); if (data.url) { uploadedImages.push(data.url); renderUploadedImages(); } } catch (err) {} } }
    function renderUploadedImages() { var c = document.getElementById('uploadedImages'); if (!c) return; var h = ''; for (var i = 0; i < uploadedImages.length; i++) { h += '<div class="uploaded-img-item" data-index="' + i + '"><img src="' + uploadedImages[i] + '" onclick="openLightbox(\'' + uploadedImages[i] + '\')" title="點擊放大預覽"><button class="del-btn" onclick="removeImage(' + i + ')">×</button></div>'; } c.innerHTML = h; initImageSortable(); }
    function initImageSortable() { var c = document.getElementById('uploadedImages'); if (!c || typeof Sortable === 'undefined') return; if (c._sortable) { c._sortable.destroy(); } c._sortable = Sortable.create(c, { animation: 200, ghostClass: 'sortable-ghost', chosenClass: 'sortable-chosen', onEnd: function(evt) { var oldIndex = evt.oldIndex; var newIndex = evt.newIndex; if (oldIndex !== newIndex) { var item = uploadedImages.splice(oldIndex, 1)[0]; uploadedImages.splice(newIndex, 0, item); renderUploadedImages(); } } }); }
    function openLightbox(url) { document.getElementById('lightboxImg').src = url; document.getElementById('imageLightbox').classList.add('show'); }
    function closeLightbox() { document.getElementById('imageLightbox').classList.remove('show'); document.getElementById('lightboxImg').src = ''; }
    function removeImage(i) { uploadedImages.splice(i, 1); renderUploadedImages(); }
    function addImageByUrl() { var url = document.getElementById('imageUrlInput').value.trim(); if (url) { uploadedImages.push(url); renderUploadedImages(); document.getElementById('imageUrlInput').value = ''; } }
    async function aiFillProductFromImage() {
        if (uploadedImages.length === 0) {
            showToast('請先上傳商品圖片');
            return;
        }
        var statusEl = document.getElementById('aiFillStatus');
        if (statusEl) statusEl.textContent = 'AI識別中，請稍候...';
        
        try {
            var existingData = {
                name_zh: document.getElementById('nameZh') ? document.getElementById('nameZh').value : '',
                price: document.getElementById('price') ? document.getElementById('price').value : ''
            };
            var userPrompt = document.getElementById('aiUserPrompt') ? document.getElementById('aiUserPrompt').value.trim() : '';
            var resp = await fetch('/ai-product-image', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ imageUrl: uploadedImages[0], existingData: existingData, userPrompt: userPrompt })
            });
            var result = await resp.json();
            if (result.success && result.data) {
                var d = result.data;
                if (d.name_zh && document.getElementById('nameZh')) document.getElementById('nameZh').value = d.name_zh;
                if (d.name_en && document.getElementById('nameEn')) document.getElementById('nameEn').value = d.name_en;
                if (d.description && document.getElementById('description')) document.getElementById('description').value = d.description;
                if (d.flower_materials && document.getElementById('specsFlowers')) document.getElementById('specsFlowers').value = d.flower_materials;
                if (d.specs && document.getElementById('specsSize')) document.getElementById('specsSize').value = d.specs;
                if (d.scent_notes && document.getElementById('scentNotes')) document.getElementById('scentNotes').value = d.scent_notes;
                // 标签
                var newTags = [];
                if (d.occasion_tags) newTags = newTags.concat(d.occasion_tags.split(',').map(function(t){return t.trim();}).filter(Boolean));
                if (d.flower_tags) newTags = newTags.concat(d.flower_tags.split(',').map(function(t){return t.trim();}).filter(Boolean));
                if (d.price_range) newTags.push(d.price_range);
                if (d.style_tags) newTags = newTags.concat(d.style_tags.split(',').map(function(t){return t.trim();}).filter(Boolean));
                selectedTags = newTags;
                initTagPills();
                if (statusEl) statusEl.textContent = '✅ 已完成，請檢查後保存';
                showToast('AI已自動填寫');
            } else {
                if (statusEl) statusEl.textContent = '❌ 識別失敗，請重試';
                showToast('識別失敗，請重試');
                console.error('AI result:', result);
            }
        } catch (e) {
            if (statusEl) statusEl.textContent = '❌ 服務錯誤';
            showToast('AI服務錯誤：' + e.message);
            console.error(e);
        }
    }

    async function renderAddonsCheckbox() {
        var c = document.getElementById('addonsCheckboxList');
        if (!c) return;
        // 如果 allAddons 为空，先加载
        if (allAddons.length === 0) {
            try {
                var r = await supabaseClient.from('addons').select('*').eq('is_active', true).order('id', { ascending: true });

            if (r.data) {
                tagCategories.tagStyle = r.data.map(function(c) { return c.name_zh; });
                styleCategoryMap = {};
                r.data.forEach(function(c) { styleCategoryMap[c.name_zh] = c.id; });
                initTagPills();
            }
        } catch (e) { console.error('載入設計風格標籤失敗:', e); }
    }
    
    async function loadAllTags() {
        try {
            var r = await supabaseClient.from('tag_settings').select('tag_name,tag_type').eq('is_active', true).order('sort_order', { ascending: true });
            if (r.data) {
                tagCategories.tagOccasion = r.data.filter(function(t) { return t.tag_type === 'occasion'; }).map(function(t) { return t.tag_name; });
                tagCategories.tagFlower = r.data.filter(function(t) { return t.tag_type === 'flower'; }).map(function(t) { return t.tag_name; });
                tagCategories.tagPrice = r.data.filter(function(t) { return t.tag_type === 'price'; }).map(function(t) { return t.tag_name; });
                initTagPills();
            }
        } catch (e) { console.error('載入標籤失敗:', e); }
    }
    function toggleTag(btn) {
        var tag = btn.getAttribute('data-tag');
        var idx = selectedTags.indexOf(tag);
        if (idx > -1) {
            selectedTags.splice(idx, 1);
            btn.classList.remove('active');
            // 如果是设计风格标签，同时移除对应分类
            if (styleCategoryMap[tag]) {
                removeCategoryFromProduct(styleCategoryMap[tag], tag);
            }
        } else {
            selectedTags.push(tag);
            btn.classList.add('active');
            // 如果是设计风格标签，同时添加对应分类
            if (styleCategoryMap[tag]) {
                addCategoryToProduct(styleCategoryMap[tag], tag);
            }
        }
    }
    function addCategoryToProduct(catId, catName) {
        try {
            var idsEl = document.getElementById('category_ids');
            var namesEl = document.getElementById('categories');
            var ids = idsEl ? JSON.parse(idsEl.value || '[]') : [];
            var names = namesEl ? JSON.parse(namesEl.value || '[]') : [];
            if (ids.indexOf(catId) === -1) {
                ids.push(catId);
                names.push(catName);
                if (idsEl) idsEl.value = JSON.stringify(ids);
                if (namesEl) namesEl.value = JSON.stringify(names);
                var catEl = document.getElementById('category');
                if (catEl) catEl.value = names.join(', ');
                var catIdEl = document.getElementById('category_id');
                if (catIdEl) catIdEl.value = ids.length > 0 ? ids[0] : '';
                setCategoryDisplay(names);
                showToast('已自動加入分類：' + catName);
            }
        } catch(e) { console.error('添加分类失败:', e); }
    }
    function removeCategoryFromProduct(catId, catName) {
        try {
            var idsEl = document.getElementById('category_ids');
            var namesEl = document.getElementById('categories');
            var ids = idsEl ? JSON.parse(idsEl.value || '[]') : [];
            var names = namesEl ? JSON.parse(namesEl.value || '[]') : [];
            var idx = ids.indexOf(catId);
            if (idx > -1) {
                ids.splice(idx, 1);
                names.splice(idx, 1);
                if (idsEl) idsEl.value = JSON.stringify(ids);
                if (namesEl) namesEl.value = JSON.stringify(names);
                var catEl = document.getElementById('category');
                if (catEl) catEl.value = names.join(', ');
                var catIdEl = document.getElementById('category_id');
                if (catIdEl) catIdEl.value = ids.length > 0 ? ids[0] : '';

        var data = {
            name_zh: document.getElementById('nameZh').value.trim(),
            name_en: document.getElementById('nameEn').value.trim(),
            price: parseFloat(document.getElementById('price').value),

            categories: JSON.parse(document.getElementById('categories').value || '[]'),
            description: document.getElementById('description').value.trim(),
            description_en: document.getElementById('descriptionEn') ? document.getElementById('descriptionEn').value.trim() : '',
            specs_flowers: document.getElementById('specsFlowers').value.trim(),
            specs_origin: document.getElementById('specsOrigin').value.trim(),
            specs_size: document.getElementById('specsSize').value.trim(),
            tags: selectedTags,
            scent_notes: document.getElementById('scentNotes').value.split(',').map(function(t){return t.trim();}).filter(Boolean),
            style_spectrum: parseInt(document.getElementById('styleSpectrum').value),
            stock: document.getElementById('stock').value,
            delivery_days: parseInt(document.getElementById('deliveryDays').value) || 1,
            is_active: document.getElementById('isActive').value === 'true',
            slug: (document.getElementById('productSlug') && document.getElementById('productSlug').value.trim()) ? document.getElementById('productSlug').value.trim() : null, 
            image_url: uploadedImages.length > 0 ? uploadedImages[0] : null,
            images: uploadedImages,
            linked_addons: selectedAddons
        };
        if (!data.name_zh || !data.price) { showToast('請填寫必要欄位'); return; }
        try {
            var result;
            if (id) { result = await supabaseClient.from('products').update(data).eq('id', id); }
            else { result = await supabaseClient.from('products').insert(data); }
            if (result.error) throw result.error;
            var productId = id;
            if (!productId && result.data && result.data.length > 0) { productId = result.data[0].id; }
            if (productId) {
                await supabaseClient.from('product_variants').delete().eq('product_id', productId);

            }

    function exportCSV() { if (!allProducts.length) { showToast('無商品'); return; } var rows = ['id,name_zh,name_en,price,category,description,tags,stock,delivery_days,is_active,image_url']; for (var i = 0; i < allProducts.length; i++) { var p = allProducts[i]; rows.push([p.id, p.name_zh, p.name_en, p.price, p.category || '', p.description || '', (p.tags || []).join('|'), p.stock, p.delivery_days || 1, p.is_active !== false, p.image_url || ''].join(',')); } var blob = new Blob([rows.join('\n')], { type: 'text/csv' }); var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'products.csv'; a.click(); }
    function parseCSVLine(line) {
        var result = [];
        var current = '';
        var inQuotes = false;
        for (var i = 0; i < line.length; i++) {
            var c = line[i];
            if (c === '"') {
                if (inQuotes && line[i+1] === '"') { current += '"'; i++; }
                else { inQuotes = !inQuotes; }
            } else if (c === ',' && !inQuotes) {
                result.push(current);
                current = '';
            } else {
                current += c;
            }
        }
        result.push(current);
        return result;
    }
    function importCSV(file) {
        var reader = new FileReader();
        reader.onload = async function(e) {
            var text = e.target.result;
            var lines = text.split(/\r?\n/);
            var header = parseCSVLine(lines[0]).map(function(h){ return h.trim().replace(/^\uFEFF/, ''); });
            var imported = 0;
            for (var i = 1; i < lines.length; i++) {
                if (!lines[i].trim()) continue;
                var v = parseCSVLine(lines[i]);
                var d = {};
                for (var j = 0; j < header.length; j++) {
                    d[header[j]] = v[j] ? v[j].trim() : '';
                }
                var nameZh = d['中文名稱'] || d.name_zh || '';
                var price = d['售價HKD'] || d.price || '';
                if (!nameZh || !price) continue;
                var images = d['圖片URLs(|分隔)'] || d.images || d.image_url || '';
                var imageArr = images ? images.split('|').filter(Boolean) : [];
                var pd = {
                    sku: d['SKU'] || d.sku || '',
                    name_zh: nameZh,
                    name_en: d['英文名稱'] || d.name_en || '',
                    price: parseFloat(price),
                    sale_price: d['特價HKD'] ? parseFloat(d['特價HKD']) : null,
                    category: d.category || '',
                    description: d['中文描述'] || d.description || '',
                    tags: (d['標籤(|分隔)'] || d.tags || '').split('|').filter(Boolean),
                    scent_notes: (d['香調備註(|分隔)'] || d.scent_notes || '').split('|').filter(Boolean),
                    style_spectrum: parseInt(d['香調分數'] || d.style_spectrum) || 0,
                    stock: d['庫存'] || d.stock || '現貨',
                    specs_flowers: d['花材'] || d.specs_flowers || '',
                    specs_origin: d['產地'] || d.specs_origin || '',
                    specs_size: d['規格'] || d.specs_size || '',
                    is_preorder: d['是否預購'] === 'Y' || d.is_preorder === 'true',
                    delivery_days: parseInt(d['預購天數'] || d.delivery_days) || 5,
                    is_active: (d['狀態'] || d.is_active) !== 'false' && (d['狀態'] || d.is_active) !== 'inactive',
                    image_url: imageArr.length > 0 ? imageArr[0] : null,
                    images: imageArr,
                    variants: d['規格變體JSON'] ? JSON.parse(d['規格變體JSON']) : [],
                    seo_title: d['SEO標題'] || '',
                    seo_description: d['SEO描述'] || '',
                    slug: d['slug'] || d['URL Slug'] || d['url_slug'] || ''
                };
                // 按SKU判断：已存在则更新，不存在则新增
                if (pd.sku) {
                    var { data: existing } = await supabaseClient.from('products').select('id').eq('sku', pd.sku).limit(1);
                    if (existing && existing.length > 0) {
                        await supabaseClient.from('products').update(pd).eq('id', existing[0].id);
                    } else {
                        await supabaseClient.from('products').insert(pd);
                    }
                } else if (d.id) {
                    await supabaseClient.from('products').update(pd).eq('id', d.id);
                } else {
                    await supabaseClient.from('products').insert(pd);
                }
                imported++;
            }
            showToast('CSV 匯入完成，共 ' + imported + ' 個商品');
            loadProducts();
        };
        reader.readAsText(file, 'UTF-8');
    }

    async function deleteAddon(id) { if (!confirm('刪除？')) return; await supabaseClient.from('addons').delete().eq('id', id); showToast('已刪除'); loadAddons(); }

    // ==================== 商品分類 ====================
    function renderCategoriesPage(c) {

        c.innerHTML += '<div class="form-row"><div class="form-group"><label class="form-label">中文名稱</label><input class="form-input" id="categoryNameZh"></div><div class="form-group"><label class="form-label">英文名稱</label><input class="form-input" id="categoryNameEn"></div></div>';

    async function handleCategoryFileUpload(file) { if (!file) return; var fd = new FormData(); fd.append('file', file); try { var res = await fetch('/r2-upload', { method: 'POST', body: fd }); var data = await res.json(); if (data.url) { categoryUploadedImage = data.url; document.getElementById('categoryImagePreview').innerHTML = '<img src="' + data.url + '" style="width:100px;height:100px;object-fit:cover;border-radius:8px;">'; } } catch (e) {} }
    async function saveCategory() { var id = document.getElementById('categoryId').value; var data = { name_zh: document.getElementById('categoryNameZh').value.trim(), name_en: document.getElementById('categoryNameEn').value.trim(), description: document.getElementById('categoryDescription').value.trim(), image_url: categoryUploadedImage || null, is_active: true }; if (!data.name_zh) { showToast('請填寫分類名稱'); return; } try { if (id) { await supabaseClient.from('categories').update(data).eq('id', id); } else { await supabaseClient.from('categories').insert(data); } showToast('保存成功'); hideCategoryForm(); loadCategories(); } catch (e) { showToast('保存失敗'); } }
    async function getCategoryProductCount(categoryId) { try { var r = await supabaseClient.from('products').select('id', { count: 'exact', head: true }).contains('category_ids', [categoryId]); return r.count || 0; } catch (e) { return 0; } }
    async function loadCategories() {
        var c = document.getElementById('categoriesGrid');

                h += '<div class="category-card-body"><p class="category-card-name">' + cat.name_zh + '</p><p style="font-size:13px;color:#383431;">' + (cat.name_en || '') + '</p><p style="font-size:13px;margin-top:5px;">' + count + ' 個商品</p><a href="products.html?category=' + encodeURIComponent(cat.name_zh) + '" target="_blank" class="btn btn-secondary btn-small" style="text-decoration:none;display:inline-block;margin-top:8px;" onclick="event.stopPropagation()">查看前台</a></div></div>';
            }

    function showCategoryList() { document.getElementById('categoryListView').style.display = 'block'; document.getElementById('categoryDetailView').style.display = 'none'; loadCategories(); }
    async function openCategoryDetail(categoryId) {
        var category = null;
        for (var i = 0; i < allCategories.length; i++) { if (allCategories[i].id === categoryId) { category = allCategories[i]; break; } }
        if (!category) return;
        document.getElementById('categoryListView').style.display = 'none';
