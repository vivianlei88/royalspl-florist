    <script>
    var SUPABASE_URL = 'https://gefqlrmozxbgfhxgngtg.supabase.co';
    var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdlZnFscm1venhiZ2ZoeGduZ3RnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYyOTI0MDQsImV4cCI6MjEwMTg2ODQwNH0.oH0fI1xpKn6arQlpvznrXXMMWsD1ZxNazRP4LZeZ68Y';
    var supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function switchTab(tab) {
        var loginForm = document.getElementById('loginForm');
        var registerForm = document.getElementById('registerForm');
        var loginTab = document.getElementById('loginTab');
        var registerTab = document.getElementById('registerTab');
        var messageBox = document.getElementById('messageBox');
        messageBox.className = 'message-box';
        messageBox.style.display = 'none';
        if (tab === 'login') {
            loginForm.style.display = 'block';
            registerForm.style.display = 'none';
            loginTab.classList.add('active');
            registerTab.classList.remove('active');
        } else {
            loginForm.style.display = 'none';
            registerForm.style.display = 'block';
            registerTab.classList.add('active');
            loginTab.classList.remove('active');
        }
    }

    function showMessage(type, text) {
        var box = document.getElementById('messageBox');
        box.className = 'message-box ' + type;
        box.textContent = text;
        box.style.display = 'block';
    }

    async function handleLogin() {
        var email = document.getElementById('loginEmail').value.trim();
        var password = document.getElementById('loginPassword').value;
        if (!email || !password) { showMessage('error', '請填寫Email和密碼'); return; }
        var btn = document.getElementById('loginBtn');
        btn.disabled = true;
        btn.textContent = '登入中...';
        try {
            var result = await supabaseClient.auth.signInWithPassword({ email: email, password: password });
            if (result.error) throw result.error;
            showMessage('success', '✓ 登入成功！');
            setTimeout(function() { window.location.href = 'index.html'; }, 1500);
        } catch (err) {
            showMessage('error', '登入失敗：' + (err.message || '請檢查Email和密碼'));
        } finally {
            btn.disabled = false;
            btn.textContent = '登入';
        }
    }

    async function handleRegister() {
        var name = document.getElementById('registerName').value.trim();
        var email = document.getElementById('registerEmail').value.trim();
        var password = document.getElementById('registerPassword').value;
        var phone = document.getElementById('registerPhone').value.trim();
        if (!name || !email || !password) { showMessage('error', '請填寫姓名、Email和密碼'); return; }
        if (password.length < 6) { showMessage('error', '密碼至少需要6位'); return; }
        var btn = document.getElementById('registerBtn');
        btn.disabled = true;
        btn.textContent = '註冊中...';
        try {
            var result = await supabaseClient.auth.signUp({ email: email, password: password });
            if (result.error) throw result.error;
            if (result.data.user) {
                await supabaseClient.from('user_profiles').insert({ id: result.data.user.id, name: name, phone: phone });
            }
            showMessage('success', '✓ 註冊成功！請登入');
            setTimeout(function() { switchTab('login'); }, 1500);
        } catch (err) {
            showMessage('error', '註冊失敗：' + (err.message || '請稍後再試'));
        } finally {
            btn.disabled = false;
            btn.textContent = '註冊';
        }
    }

    function updateCartBadge() {
        var cart = JSON.parse(localStorage.getItem('royalspl_cart') || '[]');
        var badge = document.getElementById('cartBadge');
        if (badge) { var totalItems = cart.reduce(function(sum, item) { return sum + item.quantity; }, 0); badge.textContent = totalItems; badge.style.display = totalItems > 0 ? 'flex' : 'none'; }
    }

    var menuBtn = document.getElementById('menuBtn');
    var navCloseBtn = document.getElementById('navCloseBtn');
    var navDrawer = document.getElementById('navDrawer');
    if (menuBtn) menuBtn.addEventListener('click', function() { navDrawer.classList.add('open'); });
    if (navCloseBtn) navCloseBtn.addEventListener('click', function() { navDrawer.classList.remove('open'); });

    document.addEventListener('DOMContentLoaded', updateCartBadge);
    </script>
