    <script>
        var SUPABASE_URL = 'https://gefqlrmozxbgfhxgngtg.supabase.co';
        var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdlZnFscm1venhiZ2ZoeGduZ3RnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYyOTI0MDQsImV4cCI6MjEwMTg2ODQwNH0.oH0fI1xpKn6arQlpvznrXXMMWsD1ZxNazRP4LZeZ68Y';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function loadArticle() {
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');
            const slug = params.get('slug');
            if (!id && !slug) {
                window.location.href = 'blog.html';
                return;
            }

            let query = supabaseClient
                .from('blog_posts')
                .select('id, title, content, image_url, created_at, title_en, content_en, excerpt, category')
                .eq('is_published', true);
            if (id) {
                query = query.eq('id', id);
            } else {
                query = query.eq('slug', decodeURIComponent(slug));
            }
            const { data: post, error } = await query.single();

            if (error || !post) {
                document.getElementById('articleContent').innerHTML = '<p>文章不存在或未發佈</p>';
                return;
            }

            renderArticle(post);
        }

        function updateBlogJsonLd(post) {
            try {
                const script = document.getElementById('blogJsonLd');
                if (!script) return;
                // 更新 canonical + hreflang（帶文章 id）
                try {
                    var postId = post.id || new URLSearchParams(window.location.search).get('id') || '';
                    var canonLink = document.querySelector('link[rel="canonical"]');
                    if (canonLink && postId) canonLink.href = 'https://www.royalspl.shop/blog-detail.html?id=' + postId;
                    var hreflangs = document.querySelectorAll('link[rel="alternate"][hreflang]');
                    hreflangs.forEach(function(l) {
                        if (l.hreflang === 'zh-HK' || l.hreflang === 'x-default') l.href = 'https://www.royalspl.shop/blog-detail.html?id=' + postId;
                        else if (l.hreflang === 'en') l.href = 'https://www.royalspl.shop/en/blog-detail.html?id=' + postId;
                    });
                } catch (e2) { console.error('更新 canonical/hreflang 失敗:', e2); }
                const data = {
                    "@context": "https://schema.org",
                    "@type": "BlogPosting",
                    "headline": post.title || "RoyalSpl Florist 花藝部落格",
                    "description": (post.excerpt || post.title || "RoyalSpl Florist 花藝部落格").substring(0, 200),
                    "image": post.image_url || "https://www.royalspl.shop/assets/og-share.jpg",
                    "datePublished": post.created_at || new Date().toISOString(),
                    "dateModified": post.updated_at || post.created_at || new Date().toISOString(),
                    "author": {
                        "@type": "Organization",
                        "name": "RoyalSpl Florist"
                    },
                    "publisher": {
                        "@type": "Organization",
                        "name": "RoyalSpl Florist Hong Kong",
                        "logo": {
                            "@type": "ImageObject",
                            "url": "https://www.royalspl.shop/assets/og-share.jpg"
                        }
                    },
                    "mainEntityOfPage": {
                        "@type": "WebPage",
                        "@id": "https://www.royalspl.shop/blog-detail.html?id=" + (post.id || "")
                    }
                };
                script.textContent = JSON.stringify(data);
                // 同時更新頁面 title 和 meta description
                if (post.title) {
                    document.title = post.title + ' | RoyalSpl Florist 香港花店';
                    const metaDesc = document.querySelector('meta[name="description"]');
                    if (metaDesc) metaDesc.setAttribute('content', (post.excerpt || post.title || '').substring(0, 160));
                    const ogTitle = document.querySelector('meta[property="og:title"]');
                    if (ogTitle) ogTitle.setAttribute('content', post.title + ' | RoyalSpl Florist 香港花店');
                    const ogDesc = document.querySelector('meta[property="og:description"]');
                    if (ogDesc) ogDesc.setAttribute('content', (post.excerpt || post.title || '').substring(0, 160));
                    const ogUrl = document.querySelector('meta[property="og:url"]');
                    if (ogUrl) ogUrl.setAttribute('content', window.location.href.split('#')[0]);
                }
                if (post.image_url) {
                    const ogImage = document.querySelector('meta[property="og:image"]');
                    if (ogImage) ogImage.setAttribute('content', post.image_url);
                    const twImage = document.querySelector('meta[name="twitter:image"]');
                    if (twImage) twImage.setAttribute('content', post.image_url);
                }
            } catch (e) {
                console.error('更新部落格結構化數據失敗:', e);
            }
        }

        function renderArticle(post) {
            updateBlogJsonLd(post);
            // 視覺麵包屑
            try {
                var bcNav = document.getElementById('breadcrumbNav');
                if (bcNav) {
                    bcNav.innerHTML = '<a href="index.html" style="color:#888;text-decoration:none;">首頁</a><span style="color:#ccc;">›</span>' +
                        '<a href="blog.html" style="color:#888;text-decoration:none;">花藝Blog</a>' +
                        '<span style="color:#ccc;">›</span><span style="color:#383431;font-weight:500;">' + (post.title || '') + '</span>';
                }
            } catch (e) { console.error('麵包屑生成失敗:', e); }
            const container = document.getElementById('articleContent');
            let html = `
                <h1 class="article-title">${post.title}</h1>
                <p class="article-date">${new Date(post.created_at).toLocaleDateString('zh-HK')}</p>
                ${post.image_url ? `<img src="${post.image_url}" class="article-cover" alt="${post.title}">` : ''}
            `;
            try {
                const blocks = JSON.parse(post.content);
                blocks.forEach(block => {
                    html += renderBlock(block);
                });
            } catch {
                html += `<div class="block">${post.content}</div>`;
            }
            // 添加相關商品推薦區域
            html += `
                <div class="related-products-section" style="margin-top:50px;padding-top:30px;border-top:1px solid #eee;">
                    <h2 style="font-size:22px;font-weight:600;margin-bottom:20px;color:#1A1A1A;">相關花藝推薦</h2>
                    <div id="relatedProducts" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:20px;">
                        <p style="color:#999;">加載中...</p>
                    </div>
                </div>
            `;
            container.innerHTML = html;
            // 加載相關商品
            loadRelatedProducts();
        }

        async function loadRelatedProducts() {
            try {
                const { data: products, error } = await supabaseClient
                    .from('products')
                    .select('*')
                    .eq('status', 'active')
                    .limit(4);
                if (error) throw error;
                const container = document.getElementById('relatedProducts');
                if (!container || !products || products.length === 0) {
                    if (container) container.innerHTML = '<p style="color:#999;">暫無相關商品</p>';
                    return;
                }
                let html = '';
                products.forEach(p => {
                    const img = p.images && p.images.length > 0 ? p.images[0] : (p.image_url || '');
                    html += `
                        <a href="product-detail.html?id=${p.id}" style="text-decoration:none;color:inherit;display:block;">
                            <div style="border-radius:8px;overflow:hidden;background:#f9f9f9;">
                                ${img ? `<img src="${img}" alt="${p.name_zh}" style="width:100%;height:180px;object-fit:cover;">` : '<div style="width:100%;height:180px;background:#eee;display:flex;align-items:center;justify-content:center;font-size:40px;"></div>'}
                                <div style="padding:12px;">
                                    <div style="font-size:14px;font-weight:600;color:#1A1A1A;margin-bottom:5px;">${p.name_zh || p.name_en || ''}</div>
                                    <div style="font-size:14px;color:#888;">HK$${p.price}</div>
                                </div>
                            </div>
                        </a>
                    `;
                });
                container.innerHTML = html;
            } catch (e) {
                console.error('加載相關商品失敗:', e);
            }
        }

        function renderBlock(block) {
            switch (block.type) {
                case 'paragraph': return `<div class="block"><p>${block.content.text}</p></div>`;
                case 'heading1': return `<div class="block"><h1>${block.content.text}</h1></div>`;
                case 'heading2': return `<div class="block"><h2>${block.content.text}</h2></div>`;
                case 'quote': return `<div class="block"><blockquote>${block.content.text}</blockquote></div>`;
                case 'divider': return '<hr>';
                case 'image': 
                    const imgHtml = `<img src="${block.content.src}" alt="${block.content.alt || ''}" style="max-width:100%;border-radius:5px;">`;
                    return `<div class="block">${block.content.link ? `<a href="${block.content.link}" target="_blank">${imgHtml}</a>` : imgHtml}</div>`;
                case 'video': return `<div class="block"><iframe src="${block.content.src}" allowfullscreen></iframe></div>`;
                case 'list': return `<div class="block"><ul>${block.content.items.map(i => `<li>${i}</li>`).join('')}</ul></div>`;
                case 'numberedList': return `<div class="block"><ol>${block.content.items.map(i => `<li>${i}</li>`).join('')}</ol></div>`;
                case 'button': return `<div class="block"><a href="${block.content.url}" style="display:inline-block;padding:10px 20px;background:#1A1A1A;color:white;border-radius:5px;text-decoration:none;">${block.content.text}</a></div>`;
                case 'html': return `<div class="block">${block.content.code}</div>`;
                default: return '';
            }
        }

        document.addEventListener('DOMContentLoaded', loadArticle);
    </script>
    <script src="js/ai-chat-v2.js"></script>
    <script>
    (function() {
        fetch('/track-visit', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ page_url: window.location.href, page_title: document.title, referrer: document.referrer })
        }).catch(function() {});
    })();
    </script>
<script>
    function toggleNavSection(element) {
        var submenu = element.nextElementSibling;
        var plus = element.querySelector('.nav-plus');
        if (submenu) { submenu.classList.toggle('open'); if (plus) plus.textContent = submenu.classList.contains('open') ? '−' : '+'; }
    }

    var menuBtn = document.getElementById('menuBtn');
    var navCloseBtn = document.getElementById('navCloseBtn');
    var navDrawer = document.getElementById('navDrawer');
    if (menuBtn) menuBtn.addEventListener('click', function() { navDrawer.classList.add('open'); });
    if (navCloseBtn) navCloseBtn.addEventListener('click', function() { navDrawer.classList.remove('open'); });

</script>
