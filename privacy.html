        <h1 class="page-title">私隱政策 Privacy Policy</h1>
        <div id="privacyContent" class="content-card"></div>
    </div>
    <script>
        const SUPABASE_URL = 'https://gefqlrmozxbgfhxgngtg.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdlZnFscm1venhiZ2ZoeGduZ3RnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYyOTI0MDQsImV4cCI6MjEwMTg2ODQwNH0.oH0fI1xpKn6arQlpvznrXXMMWsD1ZxNazRP4LZeZ68Y';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // 简单 Markdown 解析
        function parseMarkdown(text) {
            if (!text) return '';
            let html = text;
            html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
            html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
            html = html.replace(/^# (.+)$/gm, '<h1>$1</h1>');
            html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
            html = html.replace(/^> (.+)$/gm, '<blockquote style="border-left:3px solid #ddd;padding-left:12px;color:#666;margin:10px 0;font-style:italic;">$1</blockquote>');
            html = html.replace(/^\d+\. (.+)$/gm, '<li style="margin:5px 0;">$1</li>');
            html = html.replace(/\n/g, '<br>');
            html = html.replace(/(<br>\s*){3,}/g, '<br><br>');
            return html;
        }

        async function loadPrivacy() {
            const { data, error } = await supabaseClient
                .from('privacy_policy')
                .select('content')
                .eq('is_published', true)
                .limit(1)
                .maybeSingle();

            const container = document.getElementById('privacyContent');

            if (error) {
                console.error('載入私隱政策失敗:', error);
                container.innerHTML = '<div class="empty-state">載入失敗，請稍後再試</div>';
                return;
            }

            if (!data || !data.content) {
                container.innerHTML = '<div class="empty-state">尚無私隱政策內容</div>';
                return;
            }

            container.innerHTML = parseMarkdown(data.content);
        }

        document.addEventListener('DOMContentLoaded', loadPrivacy);
    </script>
