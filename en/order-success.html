<body>
    <div class="success-container">
        <div id="loadingState">
            <div class="success-icon">⏳</div>
            <p class="loading">ProcessingConfirmPayResult...</p>
        </div>
        
        <div id="successState" style="display:none;">
            <div class="success-icon">✅</div>
            <h1 class="success-title">PaySuccess</h1>
            <p class="success-desc">Thank you for your order！<br>We will arrange delivery as soon as possible，Order DetailsAlreadySendto your email。</p>
            
            <div class="order-info" id="orderInfo">
            </div>
            
            <div class="actions">
                <a href="/en/account.html" class="btn btn-primary">View Order</a>
                <a href="/en/products.html" class="btn btn-outline">ContinueShopping</a>
            </div>
        </div>
    </div>

    <script>
        const supabaseClient = supabase.createClient(
            'https://gefqlrmozxbgfhxgngtg.supabase.co',
            'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdlZnFscm1venhiZ2ZoeGduZ3RnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYyOTI0MDQsImV4cCI6MjEwMTg2ODQwNH0.oH0fI1xpKn6arQlpvznrXXMMWsD1ZxNazRP4LZeZ68Y'
        );

        async function confirmPayment() {
            // FPS FPS 模式：只顯示「Order Submitted（待ConfirmPayment）」，不更新為AlreadyPayment
            const urlParams = new URLSearchParams(window.location.search);
            const isFps = urlParams.get('p') === 'fps';
            
            // 从 localStorage 获取待Pay订单
            const pending = localStorage.getItem('pending_order');
            if (pending) {
                const order = JSON.parse(pending);
                
                try {
                    if (!isFps) {
                        // Credit Card / Apple Pay PaymentSuccess → 更新订单状态为AlreadyPayment
                        await supabaseClient
                            .from('orders')
                            .update({ 
                                status: 'paid',
                                updated_at: new Date().toISOString()
                            })
                            .eq('id', order.id);
                    }
                    // FPS 模式：保持 pending_payment（待ConfirmPayment），後台核對後才轉AlreadyPayment
                    
                    // 显示订单信息
                    document.getElementById('orderInfo').innerHTML = `
                        <div class="order-row"><span class="order-label">訂單號</span><span class="order-value">${order.orderCode}</span></div>
                        <div class="order-row"><span class="order-label">Products金額</span><span class="order-value">HK$${order.subtotal}</span></div>
                        <div class="order-row"><span class="order-label">配送費</span><span class="order-value">${order.deliveryFee === 0 ? '免費' : 'HK$' + order.deliveryFee}</span></div>
                        <div class="order-row"><span class="order-label">總計</span><span class="order-value" style="font-size:18px;font-weight:700;">HK$${order.total}</span></div>
                        ${isFps ? '<div class="order-row"><span class="order-label">PaymentStatus</span><span class="order-value" style="color:#c0392b;">待ConfirmPayment（FPS）</span></div>' : ''}
                    `;
                    
                    // 发送Payment完成通知邮件（FPS 模式不重複發）
                    const userEmail = order.recipient?.email || '';
                    if (userEmail && !isFps) {
                        fetch('/send-email', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                to: userEmail,
                                subject: '【RoyalSpl Florist】PaymentSuccess通知 ' + order.orderCode,
                                html: '<div style="font-family:Arial,sans-serif;max-width:600px;margin:0 auto;"><h2 style="color:#1A1A1A;">PaymentSuccess</h2><p>親愛的顧客，您的訂單AlreadyPaymentSuccess！</p><p><strong>訂單號：</strong>' + order.orderCode + '</p><p><strong>Payment金額：</strong>HK$' + order.total + '</p><p>We will arrange delivery as soon as possible，配送日期：' + (order.recipient?.date || '') + ' ' + (order.recipient?.timeSlot || '') + '</p><p style="color:#888;font-size:12px;margin-top:30px;">如有任何疑問，請聯繫我們。</p></div>'
                            })
                        }).catch(e => console.warn('SendPaymentSuccess郵件Failed:', e));
                    }
                    
                    // GA4 + Google Ads: purchase 事件（只在真正PaymentSuccess時觸發，FPS待Confirm不觸發）
                    if (typeof gtag === 'function' && !isFps) {
                        var purchaseItems = (order.items || []).map(function(item) {
                            return {
                                item_id: item.productId,
                                item_name: item.name,
                                price: item.price,
                                quantity: item.quantity
                            };
                        });
                        gtag('event', 'purchase', {
                            transaction_id: order.orderCode,
                            currency: 'HKD',
                            value: order.total,
                            items: purchaseItems
                        });
                    }
                    
                    // 清除待Pay订单
                    localStorage.removeItem('pending_order');
                    
                } catch (e) {
                    console.error('更新订单状态失败:', e);
                }
            }
            
            // 显示Success状态
            document.getElementById('loadingState').style.display = 'none';
            document.getElementById('successState').style.display = 'block';
            if (isFps) {
                // FPS 模式：修改標題與描述
                document.querySelector('.success-icon').textContent = '📋';
                document.querySelector('.success-title').textContent = 'Order Submitted';
                document.querySelector('.success-desc').innerHTML = 'Thank you for your order！<br>我們會核對您的FPSPayment（待ConfirmPayment），Confirm後會以電郵通知您。';
            }
        }
        confirmPayment();
    </script>
