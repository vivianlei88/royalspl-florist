    <script>
        const SUPABASE_URL = 'https://gefqlrmozxbgfhxgngtg.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdlZnFscm1venhiZ2ZoeGduZ3RnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYyOTI0MDQsImV4cCI6MjEwMTg2ODQwNH0.oH0fI1xpKn6arQlpvznrXXMMWsD1ZxNazRP4LZeZ68Y';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function loadContact() {
            const { data, error } = await supabaseClient
                .from('contact_settings')
                .select('*')
                .eq('is_published', true)
                .limit(1)
                .maybeSingle();

            const container = document.getElementById('contactContent');

            if (error) {
                console.error('載入Contact資料Failed:', error);
                container.innerHTML = '<div class="empty-state">載入Failed，請稍後再試</div>';
                return;
            }

            if (!data) {
                container.innerHTML = '<div class="empty-state">尚無Contact資料</div>';
                return;
            }

            let html = '<div class="contact-card">';

            if (data.shop_logo) {
                html += `<img src="${data.shop_logo}" alt="RoyalSpl Florist" class="shop-logo">`;
            }

            if (data.shop_phone) {
                html += `
                    <div class="contact-item">
                        <div class="contact-icon">📞</div>
                        <div>
                            <div class="contact-label">Phone</div>
                            <div class="contact-value"><a href="tel:${data.shop_phone}">${data.shop_phone}</a></div>
                        </div>
                    </div>`;
            }

            if (data.shop_email) {
                html += `
                    <div class="contact-item">
                        <div class="contact-icon"></div>
                        <div>
                            <div class="contact-label">Email</div>
                            <div class="contact-value"><a href="mailto:${data.shop_email}">${data.shop_email}</a></div>
                        </div>
                    </div>`;
            }

            if (data.shop_address) {
                html += `
                    <div class="contact-item">
                        <div class="contact-icon"></div>
                        <div>
                            <div class="contact-label">Address</div>
                            <div class="contact-value">${data.shop_address}</div>
                        </div>
                    </div>`;
            }

            html += '</div>';

            if (data.map_url) {
                html += `
                    <div class="map-container">
                        <iframe src="${data.map_url}" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
                    </div>`;
            }

            container.innerHTML = html;
        }

        document.addEventListener('DOMContentLoaded', loadContact);
    </script>

<script>
    function toggleNavSection(element) {
        var submenu = element.nextElementSibling;
        var plus = element.querySelector('.nav-plus');
        if (submenu) { submenu.classList.toggle('open'); if (plus) plus.textContent = submenu.classList.contains('open') ? '−' : '+'; }
    }

    var menuBtn = document.getElementById('menuBtn');
    var navCloseBtn = document.getElementById('navCloseBtn');
    var navDrawer = document.getElementById('navDrawer');
    if (menuBtn) menuBtn.addEventListener('click', function() { navDrawer.classList.add('open'); });
    if (navCloseBtn) navCloseBtn.addEventListener('click', function() { navDrawer.classList.remove('open'); });

    document.addEventListener('DOMContentLoaded', function() {
        // 先隱藏默認Hero文字，等待數據庫設置載入
        var heroContent = document.querySelector('.hero-content');

</script>
