    <div class="container">
        <a href="/en/index.html" class="back-btn">←</a>
        <h1 style="text-align:center;">FAQ</h1>
        <div id="faqList"></div>
    </div>

    <script>
        const SUPABASE_URL = 'https://gefqlrmozxbgfhxgngtg.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdlZnFscm1venhiZ2ZoeGduZ3RnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYyOTI0MDQsImV4cCI6MjEwMTg2ODQwNH0.oH0fI1xpKn6arQlpvznrXXMMWsD1ZxNazRP4LZeZ68Y';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function loadFaqs() {
            const { data, error } = await supabaseClient
                .from('faq_items')
                .select('question, question_en, answer, answer_en')
                .eq('is_published', true)
                .order('sort_order', { ascending: true });

            const container = document.getElementById('faqList');
            if (error) {
                console.error('Load FAQ failed:', error);
                container.innerHTML = '<div class="empty-state">Failed to load, please try again later</div>';
                return;
            }
            if (!data || data.length === 0) {
                container.innerHTML = '<div class="empty-state">No FAQ available</div>';
                return;
            }

            data.forEach(faq => {
                const div = document.createElement('div');
                div.className = 'faq-item';
                const question = faq.question_en || faq.question || '';
                const answer = faq.answer_en || faq.answer || '';
                div.innerHTML = `
                    <div class="question">${question}</div>
                    <div class="answer">${answer}</div>
                `;
                container.appendChild(div);
            });
        }

        document.addEventListener('DOMContentLoaded', loadFaqs);
    </script>
