<body>
    <div class="container">
        <a href="index.html" class="back-btn">←</a>
        <h1 class="page-title">聯絡我們</h1>
        <div id="contactContent"></div>
    </div>
    <script>
        const SUPABASE_URL = 'https://gefqlrmozxbgfhxgngtg.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdlZnFscm1venhiZ2ZoeGduZ3RnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYyOTI0MDQsImV4cCI6MjEwMTg2ODQwNH0.oH0fI1xpKn6arQlpvznrXXMMWsD1ZxNazRP4LZeZ68Y';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function loadContact() {
            const { data, error } = await supabaseClient
                .from('contact_settings')
                .select('*')
                .eq('is_published', true)
                .limit(1)
                .maybeSingle();

            const container = document.getElementById('contactContent');

            if (error) {
                console.error('載入聯絡資料失敗:', error);
                container.innerHTML = '<div class="empty-state">載入失敗，請稍後再試</div>';
                return;
            }

            if (!data) {
                container.innerHTML = '<div class="empty-state">尚無聯絡資料</div>';
                return;
            }

            let html = '<div class="contact-card">';

            if (data.shop_logo) {
                html += `<img src="${data.shop_logo}" alt="RoyalSpl Florist" class="shop-logo">`;
            }

            if (data.shop_phone) {
                html += `
                    <div class="contact-item">
                        <div class="contact-icon">📞</div>
                        <div>
                            <div class="contact-label">電話</div>
                            <div class="contact-value"><a href="tel:${data.shop_phone}">${data.shop_phone}</a></div>
                        </div>
                    </div>`;
            }

            if (data.shop_email) {
                html += `
                    <div class="contact-item">
                        <div class="contact-icon">✉️</div>
                        <div>
                            <div class="contact-label">電郵</div>
                            <div class="contact-value"><a href="mailto:${data.shop_email}">${data.shop_email}</a></div>
                        </div>
                    </div>`;
            }

            if (data.shop_address) {
                html += `
                    <div class="contact-item">
                        <div class="contact-icon">📍</div>
                        <div>
                            <div class="contact-label">地址</div>
                            <div class="contact-value">${data.shop_address}</div>
                        </div>
                    </div>`;
            }

            html += '</div>';

            if (data.map_url) {
                html += `
                    <div class="map-container">
                        <iframe src="${data.map_url}" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
                    </div>`;
            }

            container.innerHTML = html;
        }

        document.addEventListener('DOMContentLoaded', loadContact);
    </script>
    <script src="js/ai-chat-v2.js"></script>
</body>
